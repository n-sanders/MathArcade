<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MathArcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">MathArcade</div>
        <div class="brand-tag">Practice that feels like play</div>
      </div>
      <form class="player-box" id="player-form">
        <label for="player-name">Player</label>
        <input id="player-name" name="name" maxlength="64" autocomplete="nickname" placeholder="Your name" />
        <button type="submit">Save</button>
      </form>
    </header>

    <main>
    <section class="topic-board">
      <div class="skill-radar" id="skill-radar" aria-label="Skill snapshots"></div>
      <nav class="topic-nav" id="topic-nav" aria-label="Topics"></nav>
    </section>

    <div class="layout">
      <aside class="activity-list" id="activity-list" aria-label="Activities">
        <h2>Activities</h2>
        <div id="activity-list-items"></div>
      </aside>
      <section class="preview-panel" id="preview" aria-live="polite">
        <p class="preview-kicker" id="preview-kicker">Select an activity</p>
        <h1 id="preview-title">Pick a game</h1>
        <p id="preview-blurb">Choose something on the left to see how it works, then launch when you are ready.</p>
        <div class="howto" id="preview-howto-wrap">
          <strong>How to play</strong>
          <span id="preview-howto">—</span>
        </div>
        <p class="bonus-status" id="preview-bonus-status" hidden></p>
        <div class="preview-meta">
          <div class="your-rank" id="preview-rank" hidden></div>
          <div class="scores" id="preview-scores-wrap">
            <h3>High scores</h3>
            <ul id="preview-scores"></ul>
          </div>
        </div>
        <a class="launch" id="preview-launch" href="#">Launch</a>
      </section>
    </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/spider.js"></script>
  <script>
    (function () {
      const {
        GAMES,
        TOPICS,
        RANKS,
        getPlayerName,
        setPlayerName,
        ensurePlayer,
        loadTopScores,
        loadAllProgress,
        getDailyBonusUnlockStatus,
        getGameRankSummary,
        getTopic,
        getRadarTopics,
        getGamesForTopic,
        formatActivityList,
        formatScore,
        SPIDER_DOMAIN_LABELS,
        randomDomainScores,
        drawSpiderChart
      } = MathArcade;

      const radarEl = document.getElementById("skill-radar");
      const topicNavEl = document.getElementById("topic-nav");
      const listItemsEl = document.getElementById("activity-list-items");
      const kickerEl = document.getElementById("preview-kicker");
      const titleEl = document.getElementById("preview-title");
      const blurbEl = document.getElementById("preview-blurb");
      const howtoWrapEl = document.getElementById("preview-howto-wrap");
      const howtoEl = document.getElementById("preview-howto");
      const bonusStatusEl = document.getElementById("preview-bonus-status");
      const rankEl = document.getElementById("preview-rank");
      const scoresWrapEl = document.getElementById("preview-scores-wrap");
      const scoresEl = document.getElementById("preview-scores");
      const launchEl = document.getElementById("preview-launch");
      const nameInput = document.getElementById("player-name");
      const form = document.getElementById("player-form");

      const domainScoresByTopic = {};
      let selectedTopicId = TOPICS[0].id;
      let selectedId = null;
      let unlockStatus = getDailyBonusUnlockStatus({});
      let progressByGameId = {};

      nameInput.value = getPlayerName();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = nameInput.value.trim() || "Player";
        setPlayerName(name);
        nameInput.value = name;
        try {
          await ensurePlayer(name);
          await refreshUnlockStatus();
        } catch (err) {
          alert(err.message || "Could not save player.");
        }
      });

      function scoresForTopic(topicId) {
        if (!domainScoresByTopic[topicId]) {
          domainScoresByTopic[topicId] = randomDomainScores(SPIDER_DOMAIN_LABELS.length);
        }
        return domainScoresByTopic[topicId];
      }

      function renderRadarCharts() {
        radarEl.innerHTML = "";
        getRadarTopics().forEach((topic) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "spider-card" + (topic.id === selectedTopicId ? " is-selected" : "");
          btn.dataset.topic = topic.id;
          btn.setAttribute("aria-pressed", topic.id === selectedTopicId ? "true" : "false");
          btn.setAttribute("aria-label", `${topic.label} skill snapshot`);
          const label = document.createElement("span");
          label.className = "spider-card-label";
          label.textContent = topic.label;
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.classList.add("spider-svg");
          svg.setAttribute("aria-hidden", "true");
          btn.appendChild(label);
          btn.appendChild(svg);
          btn.addEventListener("click", () => selectTopic(topic.id));
          radarEl.appendChild(btn);
          drawSpiderChart(svg, {
            labels: SPIDER_DOMAIN_LABELS,
            scores: scoresForTopic(topic.id)
          });
        });
      }

      function renderTopicNav() {
        topicNavEl.innerHTML = "";
        TOPICS.forEach((topic) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "topic-btn";
          if (topic.id === selectedTopicId) btn.classList.add("is-selected");
          if (topic.comingSoon) btn.classList.add("coming-soon");
          if (topic.bonus) btn.classList.add("bonus");
          btn.dataset.topic = topic.id;
          btn.setAttribute("aria-pressed", topic.id === selectedTopicId ? "true" : "false");
          btn.textContent = topic.label;
          btn.addEventListener("click", () => selectTopic(topic.id));
          topicNavEl.appendChild(btn);
        });
      }

      function syncTopicSelection() {
        radarEl.querySelectorAll(".spider-card").forEach((btn) => {
          const on = btn.dataset.topic === selectedTopicId;
          btn.classList.toggle("is-selected", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
        topicNavEl.querySelectorAll(".topic-btn").forEach((btn) => {
          const on = btn.dataset.topic === selectedTopicId;
          btn.classList.toggle("is-selected", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      function renderActivityList() {
        listItemsEl.innerHTML = "";
        const games = getGamesForTopic(selectedTopicId);
        if (!games.length) {
          const empty = document.createElement("p");
          empty.className = "coming-soon-note";
          empty.textContent = "Coming soon";
          listItemsEl.appendChild(empty);
          return;
        }
        games.forEach((game) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "activity-btn" + (game.id === selectedId ? " active" : "");
          btn.dataset.id = game.id;
          if (game.bonus) btn.classList.add("bonus");
          // Rank badges still live on the activity button: [data-rank-slot] is filled by applyRankUi.
          btn.innerHTML =
            `<span class="title-row">` +
              `<span class="title">${escapeHtml(game.title)}</span>` +
              `<span class="rank-slot" data-rank-slot></span>` +
            `</span>` +
            `<span class="hint">${escapeHtml(game.blurb)}</span>` +
            (game.bonus ? `<span class="lock-badge" data-lock-badge hidden></span>` : "");
          btn.addEventListener("click", () => selectGame(game.id));
          listItemsEl.appendChild(btn);
        });
      }

      function bonusProgressHint(status) {
        if (status.unlocked) {
          return `Unlocked for today — ${status.completed} of ${status.required} activities done.`;
        }
        const stillNeed = formatActivityList(status.remainingTitles);
        if (status.required === status.catalogIds.length) {
          return stillNeed
            ? `Still need to finish: ${stillNeed}.`
            : `Finish all activities today to unlock.`;
        }
        const more = status.remaining;
        return stillNeed
          ? `Finish ${more} more today to unlock. Not done yet: ${stillNeed}.`
          : `Finish ${more} more activities today to unlock.`;
      }

      function applyUnlockUi() {
        listItemsEl.querySelectorAll(".activity-btn.bonus").forEach((btn) => {
          const locked = !unlockStatus.unlocked;
          btn.classList.toggle("locked", locked);
          btn.setAttribute("aria-disabled", locked ? "true" : "false");
          const badge = btn.querySelector("[data-lock-badge]");
          if (badge) {
            badge.hidden = !locked;
            badge.textContent = locked
              ? `${unlockStatus.completed}/${unlockStatus.required} today`
              : "";
          }
        });

        if (selectedId) {
          updatePreviewForSelection(selectedId);
        }
      }

      function rankBadgeHtml(rank, extraClass) {
        const letter = escapeHtml(rank);
        const cls = extraClass ? ` ${extraClass}` : "";
        return `<span class="rank-badge rank-${letter}${cls}">${letter}</span>`;
      }

      function rankLegendHtml() {
        return `<div class="rank-legend">${RANKS.map((r) => rankBadgeHtml(r)).join("")}</div>`;
      }

      function listRankHtml(summary) {
        if (!summary.played) return "";
        if (summary.rankMode === "single") {
          return rankBadgeHtml(summary.rank);
        }
        if (summary.rankMode === "perNumber") {
          const cells = Object.keys(summary.ranks)
            .sort((a, b) => Number(a) - Number(b))
            .map((n) => {
              const r = summary.ranks[n];
              return `<span class="rank-strip-cell" title="×${escapeHtml(n)} ${escapeHtml(r)}">` +
                `<span class="rank-strip-n">${escapeHtml(n)}</span>` +
                rankBadgeHtml(r, "rank-badge--mini") +
                `</span>`;
            })
            .join("");
          return `<span class="rank-strip" aria-label="Rank for each number">${cells}</span>`;
        }
        return "";
      }

      function previewRankHtml(game, summary) {
        if (!game || game.rankMode === "none") return "";
        if (!summary.played) {
          return `<h3>Your rank</h3><p class="your-rank-empty">Play to earn a rank</p>`;
        }
        if (summary.rankMode === "single") {
          return `<h3>Your rank</h3>` +
            `<div class="your-rank-single">` +
              rankBadgeHtml(summary.rank, "rank-badge--lg") +
              rankLegendHtml() +
            `</div>`;
        }
        if (summary.rankMode === "perNumber") {
          const cells = Object.keys(summary.ranks)
            .sort((a, b) => Number(a) - Number(b))
            .map((n) => {
              const r = summary.ranks[n];
              return `<span class="rank-grid-cell">` +
                `<span class="rank-grid-n">×${escapeHtml(n)}</span>` +
                rankBadgeHtml(r) +
                `</span>`;
            })
            .join("");
          return `<h3>Your ranks</h3>` +
            `<div class="rank-grid">${cells}</div>` +
            rankLegendHtml();
        }
        return "";
      }

      // After each list rebuild and progress refresh, paint C→S badges into [data-rank-slot].
      function applyRankUi() {
        listItemsEl.querySelectorAll(".activity-btn").forEach((btn) => {
          const game = GAMES.find((g) => g.id === btn.dataset.id);
          const slot = btn.querySelector("[data-rank-slot]");
          if (!game || !slot) return;
          slot.innerHTML = listRankHtml(getGameRankSummary(game, progressByGameId[game.id]));
        });
      }

      function updatePreviewRank(id) {
        const game = GAMES.find((g) => g.id === id);
        if (!game || !rankEl) return;
        const html = previewRankHtml(game, getGameRankSummary(game, progressByGameId[game.id]));
        rankEl.innerHTML = html;
        rankEl.hidden = !html;
      }

      function showComingSoonPreview(topic) {
        selectedId = null;
        kickerEl.textContent = "Coming soon";
        titleEl.textContent = topic.label;
        blurbEl.textContent = "New activities for this topic are on the way.";
        howtoWrapEl.hidden = true;
        bonusStatusEl.hidden = true;
        bonusStatusEl.textContent = "";
        bonusStatusEl.classList.remove("unlocked");
        rankEl.hidden = true;
        rankEl.innerHTML = "";
        scoresWrapEl.hidden = true;
        scoresEl.innerHTML = "";
        launchEl.hidden = true;
        launchEl.href = "#";
        launchEl.classList.add("disabled");
        launchEl.setAttribute("aria-disabled", "true");
        launchEl.textContent = "Coming soon";
        launchEl.onclick = (e) => e.preventDefault();
      }

      function updatePreviewForSelection(id) {
        const game = GAMES.find((g) => g.id === id);
        if (!game) return;

        const lockedBonus = !!(game.bonus && !unlockStatus.unlocked);
        kickerEl.textContent = "Select an activity";
        titleEl.textContent = game.title;
        blurbEl.textContent = game.blurb;
        howtoEl.textContent = game.howTo;
        howtoWrapEl.hidden = false;
        scoresWrapEl.hidden = false;
        launchEl.hidden = false;

        if (game.bonus) {
          bonusStatusEl.hidden = false;
          bonusStatusEl.textContent = bonusProgressHint(unlockStatus);
          bonusStatusEl.classList.toggle("unlocked", unlockStatus.unlocked);
        } else {
          bonusStatusEl.hidden = true;
          bonusStatusEl.textContent = "";
          bonusStatusEl.classList.remove("unlocked");
        }

        if (lockedBonus) {
          launchEl.href = "#";
          launchEl.classList.add("disabled");
          launchEl.setAttribute("aria-disabled", "true");
          launchEl.textContent = "Locked";
          launchEl.onclick = (e) => e.preventDefault();
        } else {
          launchEl.href = game.path;
          launchEl.classList.remove("disabled");
          launchEl.removeAttribute("aria-disabled");
          launchEl.textContent = "Launch";
          launchEl.onclick = null;
        }

        updatePreviewRank(id);
      }

      async function refreshUnlockStatus() {
        try {
          progressByGameId = await loadAllProgress();
          unlockStatus = getDailyBonusUnlockStatus(progressByGameId);
        } catch {
          progressByGameId = {};
          unlockStatus = getDailyBonusUnlockStatus({});
        }
        applyRankUi();
        applyUnlockUi();
      }

      async function selectGame(id) {
        selectedId = id;
        const game = GAMES.find((g) => g.id === id);
        if (!game) return;
        listItemsEl.querySelectorAll(".activity-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.id === id);
        });
        updatePreviewForSelection(id);

        scoresEl.innerHTML = `<li class="empty">Loading…</li>`;
        try {
          const scores = await loadTopScores(game.id, 5);
          if (selectedId !== id) return;
          if (!scores.length) {
            scoresEl.innerHTML = `<li class="empty">No scores yet — be the first!</li>`;
          } else {
            scoresEl.innerHTML = scores
              .map((s) => `<li><span>${escapeHtml(s.playerName)}</span><strong>${formatScore(s.score)}</strong></li>`)
              .join("");
          }
        } catch {
          if (selectedId !== id) return;
          scoresEl.innerHTML = `<li class="empty">Scores unavailable</li>`;
        }
      }

      function selectTopic(topicId) {
        const topic = getTopic(topicId);
        if (!topic) return;
        selectedTopicId = topicId;
        syncTopicSelection();
        const games = getGamesForTopic(topicId);
        selectedId = games[0] ? games[0].id : null;
        renderActivityList();
        applyRankUi();
        applyUnlockUi();
        if (!games.length) {
          showComingSoonPreview(topic);
          return;
        }
        selectGame(games[0].id);
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          refreshUnlockStatus();
        }
      });

      window.addEventListener("focus", () => {
        refreshUnlockStatus();
      });

      renderRadarCharts();
      renderTopicNav();
      selectTopic(selectedTopicId);

      ensurePlayer(getPlayerName() || undefined)
        .then(() => refreshUnlockStatus())
        .catch(() => applyUnlockUi());
    })();
  </script>
</body>
</html>
