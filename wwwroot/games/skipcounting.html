<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skip Counting Race · MathArcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/games.css" />
  <style>
    .race-wrap {
      position: relative;
      height: 420px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(#7ec8e3 0%, #b8e0d2 55%, #6b8f71 55%, #4f734f 100%);
    }
    #race-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .race-ui {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.75rem;
      background: linear-gradient(transparent, rgba(11, 61, 74, 0.75));
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 2;
    }
    .next-prompt {
      color: white;
      font-family: var(--font-display);
      font-size: 1.15rem;
      text-align: center;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
    }
    .pad-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .pad {
      border: none;
      border-radius: 14px;
      padding: 0.85rem;
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      background: var(--foam);
      color: var(--ink);
      cursor: pointer;
    }
    .pad:hover { background: var(--sun); }
  </style>
</head>
<body class="game-page">
  <div class="game-shell">
    <div class="game-top">
      <a class="back-link" href="/">← Arcade</a>
      <h1 class="game-title">Skip Counting Race</h1>
      <div class="hud">
        <div class="hud-chip" id="score">Score: 0</div>
        <div class="hud-chip" id="height">Height: 0</div>
        <div class="hud-chip" id="level">Level: 1</div>
      </div>
    </div>
    <div class="game-stage" style="padding: 0.75rem;">
      <div class="overlay" id="overlay">
        <h2>Skip Counting Race</h2>
        <p>Tap the next number in the skip-count sequence to jump. Stay above the rising lava!</p>
        <button class="btn btn-primary" id="start-btn">Race!</button>
      </div>
      <div class="race-wrap">
        <canvas id="race-canvas" width="900" height="420"></canvas>
        <div class="race-ui">
          <p class="next-prompt" id="prompt">Counting by 2s — next?</p>
          <div class="pad-row" id="pads"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/skipcounting.js"></script>
</body>
</html>
