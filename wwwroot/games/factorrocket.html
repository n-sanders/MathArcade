<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1b3a" />
  <title>Factor Rocket · MathArcade</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e8f1ff;
      --ink-soft: #9db4d4;
      --navy: #0b1b3a;
      --navy-deep: #071226;
      --amber: #ffb347;
      --amber-deep: #e0891a;
      --cyan: #5eead4;
      --cyan-deep: #14b8a6;
      --coral: #ff6b4a;
      --paper: rgba(12, 28, 58, 0.78);
      --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
      --font-body: "Nunito", system-ui, sans-serif;
      --topbar-height: 4.15rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 18% 8%, rgba(255, 179, 71, 0.22), transparent 28%),
        radial-gradient(circle at 86% 88%, rgba(94, 234, 212, 0.16), transparent 32%),
        linear-gradient(180deg, #071226 0%, #0b1b3a 42%, #13264d 72%, #1a1a28 100%);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button,
    a {
      font: inherit;
    }

    .game-app {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.55;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.85) 0 1.1px, transparent 1.4px),
        radial-gradient(circle, rgba(94, 234, 212, 0.45) 0 1px, transparent 1.3px);
      background-position: 0 0, 28px 22px;
      background-size: 56px 56px;
      animation: drift-stars 40s linear infinite;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.45;
    }

    .glow-one {
      top: -8%;
      left: 8%;
      width: 18rem;
      height: 10rem;
      background: radial-gradient(circle, rgba(255, 179, 71, 0.55), transparent 70%);
    }

    .glow-two {
      right: -6%;
      bottom: 8%;
      width: 16rem;
      height: 16rem;
      background: radial-gradient(circle, rgba(94, 234, 212, 0.28), transparent 70%);
    }

    .topbar {
      position: relative;
      z-index: 20;
      min-height: var(--topbar-height);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 0.8rem;
      padding: 0.55rem clamp(0.65rem, 2vw, 1.4rem);
      border-bottom: 2px solid rgba(94, 234, 212, 0.18);
      background: rgba(7, 18, 38, 0.78);
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px) saturate(1.25);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: clamp(0.5rem, 1.5vw, 1rem);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 2.35rem;
      padding: 0.45rem 0.75rem;
      color: var(--cyan);
      border: 2px solid rgba(94, 234, 212, 0.28);
      border-radius: 999px;
      background: rgba(11, 27, 58, 0.7);
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      background: rgba(20, 40, 80, 0.9);
      box-shadow: 0 7px 16px rgba(20, 184, 166, 0.18);
    }

    .game-title {
      min-width: 0;
      margin: 0;
      color: var(--amber);
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 2.3vw, 1.65rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.3rem, 1vw, 0.6rem);
      white-space: nowrap;
    }

    .hud-chip {
      display: grid;
      grid-template-columns: auto auto;
      align-items: baseline;
      gap: 0.28rem;
      min-height: 2.55rem;
      padding: 0.38rem 0.72rem;
      border: 2px solid rgba(94, 234, 212, 0.16);
      border-radius: 15px;
      background: rgba(11, 27, 58, 0.72);
      box-shadow: 0 4px 0 rgba(7, 18, 38, 0.45);
      color: var(--ink-soft);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.055em;
    }

    .hud-chip[hidden] {
      display: none;
    }

    .hud-value {
      color: var(--amber);
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hud-value.rank-C { color: #c5c5d0; }
    .hud-value.rank-B { color: #5eead4; }
    .hud-value.rank-A { color: #93b4ff; }
    .hud-value.rank-S { color: #ffb347; }

    .hud-chip.score-bump {
      animation: score-bump 420ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    .controls {
      display: flex;
      justify-content: flex-end;
    }

    .sound-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-width: 2.75rem;
      min-height: 2.65rem;
      padding: 0.45rem 0.78rem;
      color: var(--cyan);
      border: 2px solid rgba(94, 234, 212, 0.22);
      border-radius: 999px;
      background: rgba(11, 27, 58, 0.75);
      box-shadow: 0 4px 0 rgba(7, 18, 38, 0.4);
      cursor: pointer;
      font-weight: 900;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
    }

    .sound-toggle:hover {
      transform: translateY(-2px);
    }

    .sound-toggle[aria-pressed="false"] {
      color: var(--ink-soft);
      opacity: 0.75;
    }

    .sound-icon {
      width: 1.2rem;
      font-size: 1.05rem;
      line-height: 1;
    }

    .game-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .game-stage.shake {
      animation: stage-shake 340ms ease;
    }

    .timer {
      position: absolute;
      top: clamp(0.45rem, 1.4vw, 0.95rem);
      left: 50%;
      z-index: 6;
      width: min(46rem, 72%);
      height: 1.35rem;
      border: 2px solid rgba(255, 179, 71, 0.45);
      border-radius: 999px;
      background: rgba(7, 18, 38, 0.55);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      overflow: hidden;
      transform: translateX(-50%);
    }

    .timer[hidden] {
      display: none;
    }

    .timer-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--amber));
      transform-origin: left center;
    }

    .timer.urgent .timer-fill {
      background: linear-gradient(90deg, #ff6b4a, #ffb347);
    }

    .timer-text {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      height: 100%;
      color: #071226;
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .play-area {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(7.5rem, 18vw, 12.5rem);
      gap: clamp(0.5rem, 1.4vw, 1.1rem);
      height: calc(100% - clamp(8.6rem, 22vh, 12.4rem));
      min-height: 0;
      padding: clamp(0.7rem, 1.8vw, 1.3rem);
      padding-top: clamp(1.5rem, 3.4vw, 2.3rem);
    }

    .payload-col {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0.55rem;
    }

    .payload-card {
      justify-self: center;
      width: min(94%, 22rem);
      padding: 0.55rem 1rem 0.7rem;
      border: 4px solid rgba(255, 179, 71, 0.45);
      border-radius: 18px;
      background: rgba(11, 27, 58, 0.72);
      box-shadow: 0 8px 0 rgba(7, 18, 38, 0.45);
      text-align: center;
    }

    .payload-label {
      display: block;
      color: var(--ink-soft);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .payload-number {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 700;
      line-height: 1;
    }

    .tree-pane,
    .collection-pane {
      position: relative;
      min-height: 0;
      overflow: auto;
      border: 2px solid rgba(94, 234, 212, 0.14);
      border-radius: 18px;
      background: rgba(7, 18, 38, 0.35);
    }

    .tree-pane[hidden],
    .collection-pane[hidden] {
      display: none;
    }

    .tree-canvas {
      position: relative;
      min-height: 100%;
    }

    .tree-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .tree-lines path {
      fill: none;
      stroke: #9db4d4;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tree-node {
      position: absolute;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .tree-node.root {
      color: var(--ink);
      font-size: clamp(1.8rem, 4.4vw, 2.8rem);
    }

    .tree-node.composite {
      color: var(--amber);
      font-size: clamp(1.45rem, 3.6vw, 2.25rem);
    }

    .tree-node.prime {
      width: clamp(2.5rem, 6vw, 3.4rem);
      height: clamp(2.5rem, 6vw, 3.4rem);
      color: #071226;
      border: 3px solid var(--cyan-deep);
      border-radius: 50%;
      background: var(--cyan);
      font-size: clamp(1.25rem, 3.2vw, 1.85rem);
      box-shadow: 0 0 14px rgba(94, 234, 212, 0.35);
    }

    .tree-node.arrive {
      animation: node-arrive 280ms cubic-bezier(0.2, 1.4, 0.4, 1) both;
    }

    .collection-pane {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.85rem;
    }

    .collection-empty {
      align-self: center;
      width: 100%;
      margin: 1.4rem 0 0;
      color: var(--ink-soft);
      font-weight: 800;
      text-align: center;
    }

    .factor-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 3.1rem;
      min-height: 3.1rem;
      padding: 0.2rem 0.55rem;
      color: #071226;
      border: 3px solid var(--cyan-deep);
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 5px 0 #0f766e;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: clamp(1.45rem, 4vh, 2.1rem);
      font-weight: 700;
    }

    .factor-chip:hover {
      transform: translateY(-2px);
    }

    .rocket-col {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: end center;
      padding-bottom: 0.2rem;
    }

    .rocket-wrap {
      position: relative;
      width: min(100%, 11.5rem);
      height: min(100%, 68dvh);
      transform-origin: 50% 88%;
    }

    .rocket-wrap.launching {
      animation: liftoff 1.2s cubic-bezier(0.22, 0.08, 0.45, 1) forwards;
    }

    .rocket-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.35));
    }

    .fuel-rect {
      fill: url(#fuel-grad);
      transition: y 420ms ease, height 420ms ease;
    }

    .rocket-outline {
      fill: rgba(11, 27, 58, 0.18);
      stroke: #d7e6ff;
      stroke-width: 3.2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .rocket-detail {
      fill: none;
      stroke: rgba(215, 230, 255, 0.72);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .pad-plate {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 0;
      height: 0.55rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #3a3a48, #8a8a9a, #3a3a48);
      box-shadow: 0 0 18px rgba(255, 179, 71, 0.28);
    }

    .flames {
      position: absolute;
      left: 28%;
      right: 28%;
      bottom: 1%;
      height: 18%;
      pointer-events: none;
      opacity: 0;
    }

    .rocket-wrap.launching .flames {
      opacity: 1;
    }

    .flames span {
      position: absolute;
      bottom: 0;
      width: 28%;
      height: 100%;
      border-radius: 50% 50% 40% 40%;
      background: linear-gradient(180deg, #fff6c2, #ffb347 40%, #ff6b4a 78%, transparent);
      filter: blur(1px);
      animation: flame-flicker 140ms linear infinite alternate;
    }

    .flames span:nth-child(1) { left: 6%; }
    .flames span:nth-child(2) { left: 36%; height: 120%; animation-delay: 40ms; }
    .flames span:nth-child(3) { left: 66%; }

    .prime-dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      display: grid;
      justify-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.7rem 0.7rem;
      background: linear-gradient(180deg, transparent, rgba(7, 18, 38, 0.82) 28%);
    }

    .prime-pad {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.42rem;
      width: min(100%, 58rem);
    }

    .prime-btn {
      min-width: 3.15rem;
      min-height: 3rem;
      padding: 0.15rem 0.45rem;
      color: var(--ink);
      border: 3px solid rgba(255, 179, 71, 0.4);
      border-radius: 16px;
      background: rgba(18, 36, 72, 0.92);
      box-shadow: 0 5px 0 #071226;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: clamp(1.55rem, 4.4vh, 2.35rem);
      font-weight: 700;
      line-height: 1;
    }

    .prime-btn:hover {
      transform: translateY(-2px);
      border-color: var(--amber);
    }

    .prime-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #071226;
    }

    .prime-btn.shake {
      animation: card-shake 340ms ease;
    }

    .submit-btn {
      min-width: 12rem;
      min-height: 3.25rem;
      padding: 0.75rem 1.65rem;
      color: #071226;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--amber), var(--coral));
      box-shadow: 0 7px 0 #c2511a, 0 14px 22px rgba(226, 102, 28, 0.28);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
    }

    .submit-btn[hidden] {
      display: none;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .effects {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
    }

    .hit-particle {
      position: absolute;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      animation: particle-fly 620ms ease-out forwards;
    }

    .score-pop {
      position: absolute;
      color: var(--amber);
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4vw, 2.35rem);
      font-weight: 700;
      animation: score-pop 780ms ease-out forwards;
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: clamp(9.2rem, 24vh, 13.2rem);
      z-index: 7;
      max-width: min(36rem, 88%);
      margin: 0;
      padding: 0.55rem 1rem;
      color: var(--ink);
      border: 2px solid rgba(94, 234, 212, 0.28);
      border-radius: 999px;
      background: rgba(7, 18, 38, 0.86);
      font-weight: 800;
      text-align: center;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
    }

    .message.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .message.celebrate {
      border-color: rgba(255, 179, 71, 0.5);
      color: var(--amber);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at 50% 38%, rgba(94, 234, 212, 0.12), transparent 45%),
        rgba(7, 18, 38, 0.55);
      backdrop-filter: blur(8px) saturate(1.15);
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay-card {
      position: relative;
      width: min(92vw, 34rem);
      padding: clamp(1.25rem, 4vw, 2.3rem);
      overflow: auto;
      max-height: 92%;
      border: 4px solid rgba(94, 234, 212, 0.35);
      border-radius: clamp(1.6rem, 4vw, 2.5rem);
      background:
        radial-gradient(circle at 88% 12%, rgba(255, 179, 71, 0.18), transparent 24%),
        linear-gradient(145deg, rgba(16, 32, 64, 0.98), rgba(10, 22, 46, 0.96));
      box-shadow: 0 18px 0 rgba(7, 18, 38, 0.35), 0 28px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: overlay-arrive 520ms cubic-bezier(0.16, 1.35, 0.42, 1) both;
    }

    .overlay-kicker {
      display: inline-block;
      margin-bottom: 0.55rem;
      padding: 0.3rem 0.78rem;
      color: #071226;
      border-radius: 999px;
      background: var(--amber);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .overlay h2 {
      margin: 0;
      color: var(--amber);
      font-family: var(--font-display);
      font-size: clamp(2.15rem, 8vw, 4rem);
      font-weight: 700;
      line-height: 0.96;
      text-wrap: balance;
    }

    .overlay-copy {
      max-width: 38ch;
      margin: 0.85rem auto 1.2rem;
      color: var(--ink-soft);
      font-size: clamp(0.95rem, 2.5vw, 1.12rem);
      font-weight: 800;
      line-height: 1.45;
      text-wrap: balance;
    }

    #overlay-extra {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin: 0 auto 1rem;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      padding: 0.12rem 0.45rem;
      border-radius: 8px;
      border: 1px solid transparent;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }

    .rank-C {
      background: rgba(92, 92, 104, 0.22);
      color: #c5c5d0;
      border-color: rgba(197, 197, 208, 0.35);
    }
    .rank-B {
      background: rgba(20, 184, 166, 0.16);
      color: #5eead4;
      border-color: rgba(20, 184, 166, 0.4);
    }
    .rank-A {
      background: rgba(59, 95, 217, 0.2);
      color: #93b4ff;
      border-color: rgba(147, 180, 255, 0.4);
    }
    .rank-S {
      background: linear-gradient(135deg, rgba(255, 196, 56, 0.45), rgba(255, 122, 64, 0.32));
      color: #ffb347;
      border-color: rgba(255, 179, 71, 0.45);
      animation: sGlow 1.8s ease-in-out infinite;
    }

    .rank-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 0.75rem;
      margin: 0.35rem auto;
      color: var(--ink-soft);
      font-size: 0.78rem;
      max-width: 44ch;
    }

    .rank-legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .rank-up-banner,
    .rank-down-banner {
      margin: 0.35rem auto;
      padding: 0.55rem 0.95rem;
      border-radius: 12px;
      font-family: var(--font-display);
      font-weight: 700;
    }

    .rank-up-banner {
      color: var(--amber);
      border: 1px solid rgba(255, 179, 71, 0.4);
      background: linear-gradient(90deg, rgba(255, 179, 71, 0.22), rgba(94, 234, 212, 0.12));
      animation: rankPop 0.6s ease;
    }

    .rank-down-banner {
      color: #ffb4a2;
      border: 1px solid rgba(255, 107, 74, 0.4);
      background: rgba(255, 107, 74, 0.12);
    }

    .round-pips {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin: 0.45rem 0;
    }

    .round-pip {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      border: 2px solid rgba(94, 234, 212, 0.4);
      background: rgba(11, 27, 58, 0.7);
    }

    .round-pip.done {
      border-color: var(--cyan-deep);
      background: var(--cyan);
      box-shadow: 0 0 8px rgba(94, 234, 212, 0.5);
    }

    .overlay-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
      margin: 0 auto 1.15rem;
    }

    .overlay-stats[hidden] {
      display: none;
    }

    .overlay-stat {
      padding: 0.65rem;
      border: 2px solid rgba(94, 234, 212, 0.16);
      border-radius: 16px;
      background: rgba(7, 18, 38, 0.45);
    }

    .overlay-stat strong {
      display: block;
      color: var(--amber);
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4vw, 1.8rem);
    }

    .overlay-stat span {
      display: block;
      color: var(--ink-soft);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .primary-btn {
      position: relative;
      min-width: 12rem;
      min-height: 3.25rem;
      padding: 0.75rem 1.65rem;
      overflow: hidden;
      color: #071226;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--amber), var(--coral));
      box-shadow: 0 7px 0 #c2511a, 0 14px 22px rgba(226, 102, 28, 0.28);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
    }

    .primary-btn:hover {
      transform: translateY(-2px) scale(1.025);
    }

    .primary-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #c2511a;
    }

    .primary-btn:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .prime-btn:focus-visible,
    .factor-chip:focus-visible,
    .back-link:focus-visible,
    .sound-toggle:focus-visible,
    .primary-btn:focus-visible,
    .submit-btn:focus-visible {
      outline: 4px solid var(--amber);
      outline-offset: 3px;
    }

    @keyframes drift-stars {
      to { background-position: 56px 56px, 84px 78px; }
    }

    @keyframes score-bump {
      0%, 100% { transform: scale(1); }
      45% { transform: translateY(-3px) scale(1.12); }
    }

    @keyframes card-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px) rotate(-2deg); }
      40% { transform: translateX(7px) rotate(2deg); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }

    @keyframes stage-shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(2px, -2px); }
      50% { transform: translate(-2px, 2px); }
      75% { transform: translate(1px, 1px); }
    }

    @keyframes node-arrive {
      from { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes liftoff {
      0% { transform: translateY(0); }
      100% { transform: translateY(-120vh); }
    }

    @keyframes flame-flicker {
      from { transform: scaleY(0.86) scaleX(0.92); }
      to { transform: scaleY(1.12) scaleX(1.06); }
    }

    @keyframes particle-fly {
      to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
    }

    @keyframes score-pop {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translate(-50%, -48px) scale(1); opacity: 0; }
    }

    @keyframes overlay-arrive {
      from { transform: translateY(18px) scale(0.94); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes rankPop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes sGlow {
      50% { box-shadow: 0 0 16px rgba(255, 179, 71, 0.45); }
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "brand controls" "hud hud";
      }
      .brand { grid-area: brand; }
      .controls { grid-area: controls; }
      .hud { grid-area: hud; justify-content: flex-start; overflow-x: auto; }
      .play-area {
        grid-template-columns: minmax(0, 1fr) clamp(5.4rem, 22vw, 7.8rem);
        height: calc(100% - clamp(9.4rem, 28vh, 13.5rem));
      }
      .prime-btn {
        min-width: 2.7rem;
        min-height: 2.55rem;
        font-size: clamp(1.25rem, 4.6vw, 1.7rem);
      }
      .control-label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient::before,
      .rocket-wrap.launching,
      .tree-node.arrive,
      .flames span,
      .overlay-card,
      .hud-chip.score-bump {
        animation: none !important;
      }
      .fuel-rect { transition: none; }
      .rocket-wrap.launching { transform: translateY(-18vh); }
    }
  </style>
</head>
<body>
  <div class="game-app">
    <div class="ambient" aria-hidden="true">
      <span class="glow glow-one"></span>
      <span class="glow glow-two"></span>
    </div>

    <header class="topbar">
      <div class="brand">
        <a class="back-link" href="/" aria-label="Back to the MathArcade">← Arcade</a>
        <h1 class="game-title">Factor Rocket</h1>
      </div>

      <div class="hud" aria-label="Game progress">
        <div class="hud-chip">
          <span>Rank</span>
          <strong class="hud-value rank-C" id="rank-value">C</strong>
        </div>
        <div class="hud-chip">
          <span>Round</span>
          <strong class="hud-value" id="round-value">1 / 3</strong>
        </div>
        <div class="hud-chip">
          <span>Payload</span>
          <strong class="hud-value" id="payload-value">0 / 12</strong>
        </div>
        <div class="hud-chip" id="fails-chip" hidden>
          <span>Fails</span>
          <strong class="hud-value" id="fails-value">0 / 3</strong>
        </div>
        <div class="hud-chip" id="score-chip">
          <span>Score</span>
          <strong class="hud-value" id="score-value">0</strong>
        </div>
      </div>

      <div class="controls">
        <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true" aria-label="Turn sound off">
          <span class="sound-icon" id="sound-icon" aria-hidden="true">♪</span>
          <span class="control-label" id="sound-label">Sound on</span>
        </button>
      </div>
    </header>

    <main class="game-stage" id="stage">
      <div class="timer" id="timer" hidden aria-label="Payload timer">
        <div class="timer-fill" id="timer-fill"></div>
        <span class="timer-text" id="timer-text">0:25</span>
      </div>

      <div class="play-area">
        <section class="payload-col" aria-label="Current payload">
          <div class="payload-card">
            <span class="payload-label">Unrefined payload</span>
            <p class="payload-number" id="payload-number">—</p>
          </div>
          <div class="tree-pane" id="tree-pane">
            <div class="tree-canvas" id="tree-canvas">
              <svg class="tree-lines" id="tree-lines" aria-hidden="true"></svg>
            </div>
          </div>
          <div class="collection-pane" id="collection-pane" hidden aria-label="Selected primes"></div>
        </section>

        <section class="rocket-col" aria-label="Super Heavy fuel stack">
          <div class="rocket-wrap" id="rocket-wrap">
            <svg class="rocket-svg" id="rocket-svg" viewBox="0 0 200 640" role="img" aria-label="Stacked Super Heavy and Starship fuel gauge">
              <defs>
                <linearGradient id="fuel-grad" x1="0" y1="1" x2="0" y2="0">
                  <stop offset="0%" stop-color="#14b8a6" />
                  <stop offset="55%" stop-color="#5eead4" />
                  <stop offset="100%" stop-color="#a5f3fc" />
                </linearGradient>
                <clipPath id="stack-clip">
                  <path d="M100 10
                    L118 58 L122 78
                    L158 96 L122 112
                    L126 228
                    L168 262 L128 250
                    L132 272
                    L146 286
                    L148 308
                    L186 328 L148 346
                    L150 528
                    L176 552 L158 602
                    L100 628
                    L42 602 L24 552
                    L50 528
                    L52 346 L14 328 L52 308
                    L54 286
                    L68 272
                    L72 250 L32 262
                    L74 228
                    L78 112 L42 96
                    L78 78 L82 58 Z" />
                </clipPath>
              </defs>
              <rect class="fuel-rect" id="fuel-rect" x="0" y="640" width="200" height="0" clip-path="url(#stack-clip)" />
              <path class="rocket-outline" d="M100 10
                L118 58 L122 78
                L158 96 L122 112
                L126 228
                L168 262 L128 250
                L132 272
                L146 286
                L148 308
                L186 328 L148 346
                L150 528
                L176 552 L158 602
                L100 628
                L42 602 L24 552
                L50 528
                L52 346 L14 328 L52 308
                L54 286
                L68 272
                L72 250 L32 262
                L74 228
                L78 112 L42 96
                L78 78 L82 58 Z" />
              <path class="rocket-detail" d="M86 70 L114 70" />
              <path class="rocket-detail" d="M84 150 L116 150" />
              <path class="rocket-detail" d="M88 214 L112 214" />
              <path class="rocket-detail" d="M70 286 L130 286" />
              <path class="rocket-detail" d="M58 360 L142 360" />
              <path class="rocket-detail" d="M56 430 L144 430" />
              <path class="rocket-detail" d="M54 500 L146 500" />
              <path class="rocket-detail" d="M100 22 L100 58" />
              <circle class="rocket-detail" cx="100" cy="168" r="7" />
              <circle class="rocket-detail" cx="100" cy="198" r="7" />
            </svg>
            <div class="flames" id="flames" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <div class="pad-plate" aria-hidden="true"></div>
          </div>
        </section>
      </div>

      <div class="prime-dock">
        <div class="prime-pad" id="prime-pad" aria-label="Prime buttons"></div>
        <button class="submit-btn" id="submit-btn" type="button" hidden>Submit factorization</button>
      </div>

      <div class="effects" id="effects" aria-hidden="true"></div>
      <p class="message" id="message" role="status" aria-live="polite" aria-atomic="true"></p>

      <section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <div class="overlay-card">
          <span class="overlay-kicker" id="overlay-kicker">Prime factorization pad</span>
          <h2 id="overlay-title">Factor Rocket</h2>
          <p class="overlay-copy" id="overlay-copy">
            Break each composite payload into primes. Fuel the Super Heavy stack — the rocket launches when the round is complete.
          </p>
          <div id="overlay-extra"></div>
          <div class="overlay-stats" id="overlay-stats" hidden>
            <div class="overlay-stat">
              <strong id="round-points">+0</strong>
              <span>Round</span>
            </div>
            <div class="overlay-stat">
              <strong id="session-points">0</strong>
              <span>Session</span>
            </div>
          </div>
          <button class="primary-btn" id="overlay-action" type="button">Start launch prep</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/factorrocket.js"></script>
</body>
</html>
