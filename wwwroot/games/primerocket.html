<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#141b3d" />
  <title>Prime Factor Rocket · MathArcade</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #eef1ff;
      --ink-soft: #aab3d6;
      --space: #171e44;
      --space-deep: #0d1230;
      --panel: rgba(23, 30, 68, 0.72);
      --panel-border: rgba(148, 163, 255, 0.22);
      --star: #ffe066;
      --fuel: #ff9f1c;
      --fuel-deep: #e2661c;
      --flame: #ff6b35;
      --prime: #2ec4b6;
      --prime-deep: #0f8a7d;
      --comp: #ffb703;
      --comp-deep: #8a5a04;
      --pink: #ef476f;
      --green: #52d68b;
      --red: #ff5a5a;
      --cream: #f4f1ff;
      --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
      --font-body: "Nunito", system-ui, sans-serif;
      --topbar-height: 4.15rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 85% 12%, rgba(239, 71, 111, 0.26), transparent 30%),
        radial-gradient(circle at 10% 85%, rgba(46, 196, 182, 0.22), transparent 32%),
        linear-gradient(160deg, #1b2350 0%, #141b3d 45%, #0d1230 100%);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button,
    a {
      font: inherit;
    }

    .game-app {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ------------------------------------------------------------ ambient -- */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.8;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 1.4px, transparent 1.9px),
        radial-gradient(circle, rgba(255, 224, 102, 0.6) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(143, 216, 255, 0.55) 0 1.1px, transparent 1.6px);
      background-position: 0 0, 34px 42px, 70px 20px;
      background-size: 96px 96px, 132px 132px, 170px 170px;
      animation: star-drift 60s linear infinite;
    }

    .blob {
      position: absolute;
      width: clamp(12rem, 26vw, 28rem);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.4;
      animation: blob-float 14s ease-in-out infinite alternate;
    }

    .blob-one {
      top: -12%;
      left: -8%;
      background: radial-gradient(circle at 35% 35%, #4c5fd5, #232a5e 70%);
      box-shadow: inset -18px -14px 40px rgba(0, 0, 0, 0.45);
    }

    .blob-two {
      right: -9%;
      bottom: -20%;
      background: radial-gradient(circle at 35% 35%, #2ec4b6, #0f4c52 70%);
      box-shadow: inset -18px -14px 40px rgba(0, 0, 0, 0.4);
      animation-delay: -5s;
      animation-duration: 17s;
    }

    .blob-three {
      top: 20%;
      right: 14%;
      width: clamp(7rem, 13vw, 14rem);
      background: radial-gradient(circle at 35% 35%, #ef476f, #5e1d3d 72%);
      opacity: 0.3;
      animation-delay: -8s;
      animation-duration: 11s;
    }

    .ambient-star {
      position: absolute;
      color: rgba(255, 224, 102, 0.9);
      font-size: clamp(0.9rem, 2.2vw, 1.7rem);
      text-shadow: 0 0 12px rgba(255, 224, 102, 0.7);
      animation: star-twinkle 3.4s ease-in-out infinite;
    }

    .ambient-star:nth-of-type(4) { left: 6%; top: 60%; }
    .ambient-star:nth-of-type(5) { right: 8%; top: 14%; animation-delay: -1.1s; }
    .ambient-star:nth-of-type(6) { left: 36%; top: 7%; animation-delay: -2.2s; }
    .ambient-star:nth-of-type(7) { right: 30%; bottom: 6%; animation-delay: -0.6s; }

    /* ------------------------------------------------------------ topbar --- */
    .topbar {
      position: relative;
      z-index: 20;
      min-height: var(--topbar-height);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 0.8rem;
      padding: 0.55rem clamp(0.65rem, 2vw, 1.4rem);
      border-bottom: 2px solid rgba(148, 163, 255, 0.18);
      background: rgba(13, 18, 48, 0.78);
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px) saturate(1.25);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: clamp(0.5rem, 1.5vw, 1rem);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 2.35rem;
      padding: 0.45rem 0.75rem;
      color: var(--fuel);
      border: 2px solid rgba(255, 159, 28, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 7px 16px rgba(255, 107, 53, 0.25);
    }

    .game-title {
      min-width: 0;
      margin: 0;
      color: var(--star);
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 2.3vw, 1.65rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-rocket {
      text-shadow: 0 0 14px rgba(255, 159, 28, 0.6);
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.3rem, 1vw, 0.6rem);
      white-space: nowrap;
    }

    .hud-chip {
      display: grid;
      grid-template-columns: auto auto;
      align-items: baseline;
      gap: 0.28rem;
      min-height: 2.55rem;
      padding: 0.38rem 0.72rem;
      border: 2px solid rgba(148, 163, 255, 0.18);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
      color: var(--ink-soft);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .hud-chip[hidden] {
      display: none;
    }

    .hud-value {
      color: var(--star);
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hud-value.rank-C { color: #b9bed4; }
    .hud-value.rank-B { color: #52d68b; }
    .hud-value.rank-A { color: #7aa2ff; }
    .hud-value.rank-S { color: #ffb703; }

    .hud-chip.strikes .hud-value { color: var(--pink); }

    .hud-chip.score-bump {
      animation: score-bump 420ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    .controls {
      display: flex;
      justify-content: flex-end;
    }

    .sound-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-width: 2.75rem;
      min-height: 2.65rem;
      padding: 0.45rem 0.78rem;
      color: var(--fuel);
      border: 2px solid rgba(255, 159, 28, 0.26);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
      cursor: pointer;
      font-weight: 900;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
    }

    .sound-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 12px rgba(255, 107, 53, 0.25);
    }

    .sound-toggle[aria-pressed="false"] {
      color: var(--ink-soft);
      opacity: 0.75;
    }

    .sound-icon {
      width: 1.2rem;
      color: var(--prime);
      font-size: 1.05rem;
      line-height: 1;
    }

    /* ------------------------------------------------------------- stage -- */
    .game-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .game-stage::before {
      content: "";
      position: absolute;
      inset: clamp(0.4rem, 1.4vw, 1rem);
      border: 2px solid rgba(148, 163, 255, 0.16);
      border-radius: clamp(1.3rem, 3vw, 2.4rem);
      background: rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 0 50px rgba(20, 27, 61, 0.5);
      pointer-events: none;
    }

    .game-stage.solve-flash::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(circle at var(--flash-x, 50%) var(--flash-y, 50%), rgba(255, 224, 102, 0.7), rgba(255, 159, 28, 0.24) 18%, transparent 46%);
      animation: solve-flash 520ms ease-out both;
    }

    .game-stage.shake {
      animation: stage-shake 340ms ease;
    }

    .game-stage.rumble {
      animation: stage-rumble 620ms linear;
    }

    .play-area {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: clamp(12.5rem, 22vw, 17.5rem) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      gap: clamp(0.5rem, 1.4vw, 1.1rem);
      min-width: 0;
      min-height: 0;
      padding: clamp(0.9rem, 2.2vw, 1.7rem);
      padding-top: clamp(1.4rem, 3vw, 2rem);
    }

    /* ------------------------------------------------------- S timer ------ */
    .timer {
      position: absolute;
      top: clamp(0.55rem, 1.6vw, 1.15rem);
      left: 50%;
      z-index: 6;
      width: min(46rem, 72%);
      height: 1.35rem;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: rgba(13, 18, 48, 0.6);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transform: translateX(-50%);
    }

    .timer-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--prime), var(--green));
      transition: width 120ms linear;
    }

    .timer.urgent .timer-fill {
      background: linear-gradient(90deg, var(--red), var(--fuel));
      animation: timer-pulse 700ms ease-in-out infinite;
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* ------------------------------------------------------- left panel --- */
    .left-panel {
      grid-column: 1;
      grid-row: 1;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: clamp(0.4rem, 1.2vh, 0.85rem);
      min-height: 0;
      padding: clamp(0.55rem, 1.4vw, 1rem);
      border: 2px solid var(--panel-border);
      border-radius: clamp(1rem, 2.2vw, 1.6rem);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .rocket-panel {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(0.45rem, 1vw, 0.85rem);
      min-height: 0;
      padding: 0.4rem 0.2rem 0;
    }

    .fuel-gauge-wrap {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      justify-items: center;
      gap: 0.3rem;
      height: 100%;
      min-height: 0;
    }

    .fuel-label {
      color: var(--fuel);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .fuel-gauge {
      display: flex;
      flex-direction: column-reverse;
      gap: 3px;
      width: clamp(1.5rem, 2.4vw, 2.1rem);
      height: 100%;
      min-height: 0;
      padding: 4px;
      border: 2px solid rgba(255, 159, 28, 0.5);
      border-radius: 12px;
      background: rgba(13, 18, 48, 0.65);
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.45);
    }

    .fuel-segment {
      flex: 1;
      min-height: 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      transition: background 200ms ease, box-shadow 200ms ease;
    }

    .fuel-segment.filled {
      background: linear-gradient(180deg, var(--star), var(--fuel));
      box-shadow: 0 0 9px rgba(255, 159, 28, 0.7);
    }

    .fuel-segment.pop {
      animation: fuel-pop 400ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    .rocket-holder {
      position: relative;
      flex: 1;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .rocket-svg {
      position: relative;
      z-index: 2;
      height: 100%;
      width: auto;
      max-width: 100%;
      display: block;
    }

    .rocket-body { fill: #f4f6ff; stroke: #2a3160; stroke-width: 6; stroke-linejoin: round; }
    .rocket-nose { fill: var(--flame); stroke: #2a3160; stroke-width: 6; stroke-linejoin: round; }
    .rocket-fin { fill: var(--pink); stroke: #2a3160; stroke-width: 6; stroke-linejoin: round; }
    .rocket-window-ring { fill: #8fd8ff; stroke: #2a3160; stroke-width: 6; }
    .rocket-window { fill: #1c2a5e; }
    .rocket-glint { fill: rgba(255, 255, 255, 0.85); }
    .rocket-stripe { fill: var(--fuel); stroke: #2a3160; stroke-width: 5; }
    .flame-outer { fill: var(--flame); }
    .flame-mid { fill: var(--fuel); }
    .flame-core { fill: var(--star); }

    .rocket-flame {
      transform: scaleY(0);
      transform-box: fill-box;
      transform-origin: 50% 0%;
    }

    .rocket-holder.launching .rocket-flame {
      transform: scaleY(1);
      animation: flame-flicker 110ms ease-in-out infinite alternate;
    }

    .rocket-holder.launching .rocket-svg {
      animation: rocket-launch 950ms cubic-bezier(0.55, 0.05, 0.75, 0.35) forwards;
    }

    .rocket-holder.arriving .rocket-svg {
      animation: rocket-arrive 720ms cubic-bezier(0.2, 1.25, 0.4, 1) both;
    }

    .rocket-holder.sputter .rocket-svg {
      animation: rocket-sputter 520ms ease;
    }

    .rocket-holder.sputter .rocket-flame {
      animation: flame-sputter 520ms ease;
    }

    .launch-pad {
      position: absolute;
      bottom: -2px;
      left: 50%;
      z-index: 1;
      width: 118%;
      height: 0.8rem;
      border: 2px solid rgba(148, 163, 255, 0.35);
      border-radius: 8px;
      background: linear-gradient(180deg, #3a4370, #232a52);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transform: translateX(-50%);
    }

    .payload-panel {
      padding: 0.45rem 0.6rem 0.55rem;
      border: 2px solid rgba(46, 196, 182, 0.3);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .payload-panel-label {
      display: block;
      margin-bottom: 0.25rem;
      color: var(--prime);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .payload-meter {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.15rem 0.2rem;
      justify-items: center;
    }

    .pip {
      font-size: clamp(0.85rem, 1.9vh, 1.25rem);
      line-height: 1.2;
      filter: grayscale(1) opacity(0.35);
      transition: filter 200ms ease;
    }

    .pip.done {
      filter: none;
    }

    .pip.failed {
      filter: none;
    }

    .pip.pop {
      animation: pip-pop 520ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    /* ------------------------------------------------------- center field - */
    .center-field {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(0.5rem, 1.4vh, 0.9rem);
      min-width: 0;
      min-height: 0;
      padding: clamp(0.55rem, 1.4vw, 1rem);
      border: 2px solid var(--panel-border);
      border-radius: clamp(1rem, 2.2vw, 1.6rem);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .payload-card {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(0.5rem, 1.6vw, 1.2rem);
      padding: 0.3rem 1rem 0.45rem;
      border: 3px solid rgba(255, 183, 3, 0.45);
      border-radius: 18px;
      background: linear-gradient(150deg, rgba(255, 183, 3, 0.16), rgba(255, 255, 255, 0.06));
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3), 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .payload-card.arrive .payload-value {
      animation: payload-pop 520ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    .payload-label {
      color: var(--comp);
      font-size: clamp(0.7rem, 1.6vh, 0.85rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .payload-value {
      color: #fff;
      font-family: var(--font-display);
      font-size: clamp(2rem, 6.5vh, 3.3rem);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 18px rgba(255, 183, 3, 0.45);
    }

    .payload-remaining {
      color: var(--ink-soft);
      font-size: clamp(0.85rem, 2vh, 1.05rem);
      font-weight: 900;
    }

    .payload-remaining b {
      color: var(--comp);
      font-family: var(--font-display);
      font-size: 1.35em;
    }

    /* ------------------------------------------------------- factor tree -- */
    .tree-area {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .tree-edges {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .tree-edges line {
      stroke: rgba(170, 179, 214, 0.45);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .tree-edges line.pending {
      stroke: rgba(170, 179, 214, 0.22);
      stroke-dasharray: 5 7;
    }

    .tree-node {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      min-width: clamp(2.1rem, 5.4vh, 3.1rem);
      height: clamp(2.1rem, 5.4vh, 3.1rem);
      padding: 0 0.35rem;
      border: 3px solid rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 2.9vh, 1.6rem);
      font-weight: 700;
      line-height: 1;
      transform: translate(-50%, -50%);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
    }

    .tree-node.comp {
      color: var(--comp-deep);
      background: linear-gradient(150deg, #ffd166, var(--comp));
    }

    .tree-node.prime {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.85);
      background: linear-gradient(150deg, var(--prime), var(--prime-deep));
    }

    .tree-node.ghost {
      color: transparent;
      background: transparent;
      border: 3px dashed rgba(170, 179, 214, 0.32);
      box-shadow: none;
    }

    .tree-node.current {
      box-shadow:
        0 0 0 4px rgba(255, 183, 3, 0.3),
        0 0 20px rgba(255, 183, 3, 0.55),
        0 5px 12px rgba(0, 0, 0, 0.4);
    }

    .tree-node.prime-soon {
      animation: prime-soon-pulse 480ms ease-in-out infinite;
    }

    .tree-node.pop {
      animation: node-pop 440ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    /* ------------------------------------------------------- free tray ---- */
    .tray-area {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: clamp(0.45rem, 1.2vh, 0.8rem);
      min-height: 0;
    }

    .tray-area[hidden] {
      display: none;
    }

    .tray-chips {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: clamp(0.45rem, 1.1vw, 0.75rem);
      min-height: 0;
      padding: clamp(0.7rem, 1.8vw, 1.1rem);
      border: 2px dashed rgba(46, 196, 182, 0.45);
      border-radius: 16px;
      background: rgba(46, 196, 182, 0.07);
      overflow-y: auto;
    }

    .tray-chips.empty::before {
      content: "Tap prime buttons below to load fuel";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: var(--ink-soft);
      font-weight: 800;
      font-size: clamp(0.9rem, 2.2vh, 1.1rem);
      text-align: center;
      pointer-events: none;
    }

    .tray-chips.shake {
      animation: slot-shake 420ms ease;
    }

    .tray-chip {
      display: grid;
      place-items: center;
      min-width: clamp(2.7rem, 6.4vh, 3.8rem);
      height: clamp(2.7rem, 6.4vh, 3.8rem);
      padding: 0 0.4rem;
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      background: linear-gradient(150deg, var(--prime), var(--prime-deep));
      box-shadow: 0 5px 0 rgba(15, 138, 125, 0.45), 0 8px 16px rgba(0, 0, 0, 0.35);
      color: #fff;
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 3.4vh, 1.9rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform 130ms ease, box-shadow 130ms ease;
    }

    .tray-chip:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 0 rgba(15, 138, 125, 0.4), 0 12px 20px rgba(0, 0, 0, 0.4);
    }

    .tray-chip.pop {
      animation: node-pop 400ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    .tray-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.6rem, 1.6vw, 1rem);
    }

    .clear-btn {
      min-height: 3rem;
      padding: 0.5rem 1.3rem;
      color: var(--ink-soft);
      border: 2px solid rgba(148, 163, 255, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      cursor: pointer;
      font-weight: 900;
      transition: transform 140ms ease, background 140ms ease;
    }

    .clear-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.13);
    }

    .submit-btn {
      position: relative;
      min-width: min(15rem, 60%);
      min-height: 3.2rem;
      padding: 0.6rem 1.5rem;
      overflow: hidden;
      color: #fff;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--fuel), var(--pink));
      box-shadow:
        0 6px 0 #a33712,
        0 12px 20px rgba(239, 71, 111, 0.35);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.6vh, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 8px 0 #a33712,
        0 16px 24px rgba(239, 71, 111, 0.4);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #a33712,
        0 8px 14px rgba(239, 71, 111, 0.3);
    }

    .submit-btn:disabled {
      cursor: not-allowed;
      filter: grayscale(0.5);
      opacity: 0.55;
    }

    /* --------------------------------------------------------- prime pad -- */
    .prime-pad {
      grid-column: 1 / -1;
      grid-row: 2;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(clamp(3rem, 5.5vw, 4.4rem), 1fr));
      gap: clamp(0.35rem, 0.9vw, 0.6rem);
      padding: clamp(0.5rem, 1.2vw, 0.9rem);
      border: 2px solid var(--panel-border);
      border-radius: clamp(1rem, 2.2vw, 1.6rem);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .prime-btn {
      min-height: clamp(2.9rem, 7.6vh, 4.1rem);
      padding: 0.1rem 0.2rem;
      border: 3px solid rgba(46, 196, 182, 0.55);
      border-radius: 14px;
      background:
        radial-gradient(circle at 80% 12%, rgba(46, 196, 182, 0.22), transparent 42%),
        linear-gradient(150deg, #ffffff, #e4fffa);
      box-shadow: 0 5px 0 rgba(15, 138, 125, 0.42), 0 9px 15px rgba(0, 0, 0, 0.32);
      color: #0b4f48;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 3.4vh, 1.85rem);
      font-weight: 700;
      line-height: 1;
      transition: transform 130ms ease, box-shadow 130ms ease, border-color 130ms ease;
    }

    .prime-btn:hover {
      transform: translateY(-3px) scale(1.04);
      border-color: var(--prime);
      box-shadow: 0 8px 0 rgba(15, 138, 125, 0.4), 0 13px 20px rgba(0, 0, 0, 0.36);
    }

    .prime-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(15, 138, 125, 0.42), 0 5px 10px rgba(0, 0, 0, 0.3);
    }

    .prime-btn.shake {
      animation: card-shake 420ms ease;
    }

    .prime-btn:disabled {
      cursor: default;
      opacity: 0.55;
    }

    /* ------------------------------------------------ effects & message -- */
    .effects {
      position: absolute;
      inset: 0;
      z-index: 7;
      overflow: hidden;
      pointer-events: none;
    }

    .fx-particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size, 10px);
      aspect-ratio: 1;
      border-radius: var(--radius, 50%);
      background: var(--color, var(--star));
      box-shadow: 0 0 8px rgba(255, 224, 102, 0.7);
      transform: translate(-50%, -50%) scale(0);
      animation: particle-burst var(--duration, 720ms) var(--delay, 0ms) cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
    }

    .score-pop {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 2;
      color: #fff;
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4vw, 2.35rem);
      font-weight: 700;
      text-shadow:
        0 3px 0 var(--fuel-deep),
        0 0 12px var(--star),
        0 0 26px rgba(255, 159, 28, 0.8);
      transform: translate(-50%, -20%) scale(0.5);
      animation: score-float 900ms cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
    }

    .confetti {
      position: absolute;
      top: -8%;
      left: var(--left);
      width: var(--width, 9px);
      height: var(--height, 17px);
      border-radius: 3px;
      background: var(--color);
      opacity: 0;
      transform: rotate(var(--start-rotation));
      animation: confetti-fall var(--fall-time) var(--delay) cubic-bezier(0.16, 0.72, 0.44, 1) forwards;
    }

    .fact-banner {
      position: absolute;
      left: 50%;
      top: 40%;
      z-index: 9;
      max-width: 92%;
      padding: 0.5rem 1.25rem;
      color: #fff;
      border: 3px solid rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--prime), var(--prime-deep));
      box-shadow: 0 10px 28px rgba(15, 138, 125, 0.5);
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 3.4vh, 2rem);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translate(-50%, -50%) scale(0);
      animation: fact-stamp 1600ms cubic-bezier(0.18, 1.45, 0.4, 1) forwards;
      pointer-events: none;
    }

    .fact-banner.failed {
      background: linear-gradient(135deg, var(--pink), #c22047);
      box-shadow: 0 10px 28px rgba(239, 71, 111, 0.45);
    }

    .round-ribbon {
      position: absolute;
      left: 50%;
      top: 46%;
      z-index: 9;
      padding: 0.55rem 1.35rem;
      color: #fff;
      border: 3px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--fuel), var(--pink));
      box-shadow: 0 10px 28px rgba(255, 107, 53, 0.4);
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 4vw, 2rem);
      font-weight: 700;
      white-space: nowrap;
      transform: translate(-50%, -50%) scale(0);
      animation: ribbon-pop 1050ms cubic-bezier(0.18, 1.45, 0.4, 1) forwards;
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: clamp(0.7rem, 2vw, 1.2rem);
      z-index: 8;
      max-width: min(90vw, 40rem);
      margin: 0;
      padding: 0.55rem 1rem;
      color: var(--ink);
      border: 2px solid rgba(148, 163, 255, 0.4);
      border-radius: 999px;
      background: rgba(20, 27, 61, 0.92);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-weight: 900;
      text-align: center;
      transform: translate(-50%, 150%);
      opacity: 0;
      pointer-events: none;
      transition: transform 260ms cubic-bezier(0.2, 1.35, 0.4, 1), opacity 180ms ease;
    }

    .message.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .message.celebrate {
      color: var(--star);
      background: linear-gradient(90deg, #232a52, #2c3570);
    }

    .rotate-hint {
      position: absolute;
      top: 0.4rem;
      left: 50%;
      z-index: 30;
      display: none;
      padding: 0.35rem 0.9rem;
      color: #fff;
      border-radius: 999px;
      background: rgba(13, 18, 48, 0.88);
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* ------------------------------------------------------------ overlay - */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at 50% 38%, rgba(76, 95, 213, 0.3), transparent 48%),
        rgba(9, 12, 32, 0.55);
      backdrop-filter: blur(8px) saturate(1.15);
      opacity: 1;
      visibility: visible;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay-card {
      position: relative;
      width: min(92vw, 34rem);
      max-height: 94%;
      overflow-y: auto;
      padding: clamp(1.25rem, 4vw, 2.3rem);
      border: 4px solid rgba(148, 163, 255, 0.35);
      border-radius: clamp(1.6rem, 4vw, 2.5rem);
      background:
        radial-gradient(circle at 88% 12%, rgba(255, 159, 28, 0.2), transparent 26%),
        linear-gradient(145deg, rgba(32, 40, 88, 0.98), rgba(19, 25, 58, 0.97));
      box-shadow:
        0 18px 0 rgba(0, 0, 0, 0.22),
        0 28px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: overlay-arrive 520ms cubic-bezier(0.16, 1.35, 0.42, 1) both;
    }

    .overlay-card::before,
    .overlay-card::after {
      content: "✦";
      position: absolute;
      color: rgba(255, 224, 102, 0.5);
      font-size: clamp(1.4rem, 5vw, 2.6rem);
      transform: rotate(-14deg);
      pointer-events: none;
    }

    .overlay-card::before { left: 0.6rem; top: 0.5rem; }
    .overlay-card::after { right: 0.7rem; bottom: 0.6rem; transform: rotate(18deg); }

    .overlay-kicker {
      display: inline-block;
      margin-bottom: 0.55rem;
      padding: 0.3rem 0.78rem;
      color: var(--star);
      border-radius: 999px;
      background: rgba(255, 224, 102, 0.14);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .overlay h2 {
      margin: 0;
      color: var(--star);
      font-family: var(--font-display);
      font-size: clamp(2rem, 7.5vw, 3.6rem);
      font-weight: 700;
      line-height: 0.98;
      text-wrap: balance;
    }

    .overlay-copy {
      max-width: 38ch;
      margin: 0.85rem auto 1.2rem;
      color: var(--ink-soft);
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      font-weight: 800;
      line-height: 1.45;
      text-wrap: balance;
    }

    #overlay-extra {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0 auto 1rem;
      text-align: center;
      color: var(--ink);
    }

    #overlay-extra p {
      margin: 0.25rem 0;
      font-weight: 800;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      padding: 0.12rem 0.45rem;
      border-radius: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      border: 1px solid transparent;
    }

    .rank-C {
      background: rgba(185, 190, 212, 0.14);
      color: #c6cbe0;
      border-color: rgba(185, 190, 212, 0.4);
    }
    .rank-B {
      background: rgba(82, 214, 139, 0.14);
      color: #52d68b;
      border-color: rgba(82, 214, 139, 0.42);
    }
    .rank-A {
      background: rgba(122, 162, 255, 0.16);
      color: #7aa2ff;
      border-color: rgba(122, 162, 255, 0.45);
    }
    .rank-S {
      background: linear-gradient(135deg, rgba(255, 196, 56, 0.4), rgba(255, 122, 64, 0.3));
      color: #ffb703;
      border-color: rgba(255, 183, 3, 0.5);
      box-shadow: 0 0 10px rgba(255, 176, 40, 0.3);
      animation: sGlow 1.8s ease-in-out infinite;
    }

    .rank-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 0.75rem;
      margin: 0.35rem auto;
      font-size: 0.78rem;
      color: var(--ink-soft);
      max-width: 44ch;
    }

    .rank-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }

    .rank-up-banner {
      margin: 0.35rem auto;
      padding: 0.55rem 0.95rem;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(255, 224, 102, 0.25), rgba(239, 71, 111, 0.2));
      border: 1px solid rgba(255, 183, 3, 0.45);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--star);
      animation: rankPop 0.6s ease;
    }

    .rank-down-banner {
      margin: 0.35rem auto;
      padding: 0.55rem 0.95rem;
      border-radius: 12px;
      background: rgba(239, 71, 111, 0.12);
      border: 1px solid rgba(239, 71, 111, 0.4);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--pink);
      animation: rankPop 0.6s ease;
    }

    .round-pips {
      display: inline-flex;
      gap: 0.4rem;
      margin: 0.4rem auto 0.1rem;
    }

    .round-pip {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      border: 2px solid rgba(255, 159, 28, 0.45);
      background: rgba(255, 255, 255, 0.08);
    }

    .round-pip.done {
      border-color: var(--prime-deep);
      background: var(--prime);
      box-shadow: 0 0 8px rgba(46, 196, 182, 0.55);
    }

    .launch-log {
      display: grid;
      gap: 0.14rem;
      width: min(100%, 23rem);
      max-height: 9.5rem;
      margin: 0.45rem auto 0.6rem;
      padding: 0.55rem 0.8rem;
      overflow-y: auto;
      border: 1px solid rgba(148, 163, 255, 0.22);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
    }

    .launch-log-row {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      color: var(--ink);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .launch-log-row .ll-value {
      color: var(--comp);
      font-family: var(--font-display);
    }

    .launch-log-row .ll-factors {
      color: var(--prime);
    }

    .launch-log-row.failed .ll-factors {
      color: var(--pink);
    }

    .overlay-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
      margin: 0 auto 1.15rem;
    }

    .overlay-stats[hidden] {
      display: none;
    }

    .overlay-stat {
      padding: 0.65rem;
      border: 2px solid rgba(148, 163, 255, 0.16);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
    }

    .overlay-stat strong {
      display: block;
      color: var(--star);
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4vw, 1.8rem);
    }

    .overlay-stat span {
      display: block;
      color: var(--ink-soft);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .primary-btn {
      position: relative;
      min-width: 12rem;
      min-height: 3.25rem;
      padding: 0.75rem 1.65rem;
      overflow: hidden;
      color: #fff;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--fuel), var(--pink));
      box-shadow:
        0 7px 0 #a33712,
        0 14px 22px rgba(239, 71, 111, 0.3);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .primary-btn::after {
      content: "";
      position: absolute;
      top: -80%;
      left: -35%;
      width: 22%;
      height: 260%;
      background: rgba(255, 255, 255, 0.5);
      transform: rotate(24deg);
      animation: button-shine 2.7s ease-in-out infinite;
    }

    .primary-btn:hover {
      transform: translateY(-2px) scale(1.025);
      box-shadow:
        0 9px 0 #a33712,
        0 18px 26px rgba(239, 71, 111, 0.36);
    }

    .primary-btn:active {
      transform: translateY(5px);
      box-shadow:
        0 2px 0 #a33712,
        0 8px 14px rgba(239, 71, 111, 0.26);
    }

    .primary-btn:disabled {
      cursor: wait;
      filter: grayscale(0.25);
      opacity: 0.72;
    }

    .prime-btn:focus-visible,
    .tray-chip:focus-visible,
    .clear-btn:focus-visible,
    .submit-btn:focus-visible,
    .back-link:focus-visible,
    .sound-toggle:focus-visible,
    .primary-btn:focus-visible {
      outline: 4px solid var(--star);
      outline-offset: 3px;
    }

    /* ---------------------------------------------------------- keyframes - */
    @keyframes star-drift {
      to { background-position: 96px 96px, 166px 174px, 240px 190px; }
    }

    @keyframes blob-float {
      0% { transform: translate3d(-2%, -2%, 0) scale(0.97); }
      100% { transform: translate3d(4%, 5%, 0) scale(1.05); }
    }

    @keyframes star-twinkle {
      0%, 100% { transform: scale(0.8) rotate(-8deg); opacity: 0.45; }
      50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
    }

    @keyframes sGlow {
      50% { box-shadow: 0 0 20px rgba(255, 176, 40, 0.5); }
    }

    @keyframes rankPop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes score-bump {
      0%, 100% { transform: scale(1); }
      45% { transform: translateY(-3px) scale(1.12) rotate(-1deg); box-shadow: 0 8px 18px rgba(255, 159, 28, 0.35); }
    }

    @keyframes card-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px) rotate(-2deg); }
      40% { transform: translateX(7px) rotate(2deg); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }

    @keyframes slot-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    @keyframes stage-shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(2px, -2px); }
      50% { transform: translate(-2px, 2px); }
      75% { transform: translate(1px, 1px); }
    }

    @keyframes stage-rumble {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(1.5px, 1px); }
      20% { transform: translate(-1.5px, -1px); }
      30% { transform: translate(2px, -1px); }
      40% { transform: translate(-2px, 1.5px); }
      50% { transform: translate(1.5px, -1.5px); }
      60% { transform: translate(-1px, 1px); }
      70% { transform: translate(1px, 1.5px); }
      80% { transform: translate(-1.5px, -1px); }
      90% { transform: translate(1px, -1px); }
    }

    @keyframes flame-flicker {
      0% { transform: scaleY(1) scaleX(1); }
      100% { transform: scaleY(1.14) scaleX(0.92); }
    }

    @keyframes flame-sputter {
      0%, 100% { transform: scaleY(0); }
      25% { transform: scaleY(0.55); }
      45% { transform: scaleY(0.15); }
      65% { transform: scaleY(0.45); }
      85% { transform: scaleY(0.08); }
    }

    @keyframes rocket-launch {
      0% { transform: translateY(0); }
      12% { transform: translateY(2.5%); }
      100% { transform: translateY(-135%); }
    }

    @keyframes rocket-arrive {
      0% { transform: translateY(-135%); }
      70% { transform: translateY(2%); }
      100% { transform: translateY(0); }
    }

    @keyframes rocket-sputter {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      20% { transform: translate(-4px, 1px) rotate(-2.5deg); }
      40% { transform: translate(4px, -1px) rotate(2.5deg); }
      60% { transform: translate(-3px, 0) rotate(-1.5deg); }
      80% { transform: translate(3px, 1px) rotate(1.5deg); }
    }

    @keyframes fuel-pop {
      0% { transform: scale(0.5); filter: brightness(1.8); }
      60% { transform: scale(1.25); }
      100% { transform: scale(1); filter: none; }
    }

    @keyframes pip-pop {
      0% { transform: scale(0.4) rotate(-20deg); }
      55% { transform: scale(1.5) rotate(12deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes payload-pop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes node-pop {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      60% { transform: translate(-50%, -50%) scale(1.22); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .tray-chip.pop {
      animation-name: chip-pop;
    }

    @keyframes chip-pop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.22); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes prime-soon-pulse {
      0%, 100% {
        box-shadow: 0 0 0 4px rgba(82, 214, 139, 0.35), 0 0 16px rgba(82, 214, 139, 0.6);
      }
      50% {
        box-shadow: 0 0 0 7px rgba(82, 214, 139, 0.22), 0 0 28px rgba(82, 214, 139, 0.85);
      }
    }

    @keyframes solve-flash {
      0% { opacity: 0; }
      28% { opacity: 0.88; }
      100% { opacity: 0; }
    }

    @keyframes timer-pulse {
      50% { filter: brightness(1.25); }
    }

    @keyframes particle-burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
      }
      18% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rotation)) scale(1);
      }
    }

    @keyframes score-float {
      0% { opacity: 0; transform: translate(-50%, -10%) scale(0.45) rotate(-5deg); }
      22% { opacity: 1; transform: translate(-50%, -35%) scale(1.2) rotate(2deg); }
      100% { opacity: 0; transform: translate(-50%, -180%) scale(0.92) rotate(0); }
    }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(var(--start-rotation)); }
      10% { opacity: 1; }
      100% { opacity: 0.95; transform: translate3d(var(--drift), 115vh, 0) rotate(var(--end-rotation)); }
    }

    @keyframes fact-stamp {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-8deg); }
      14% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
      24% { transform: translate(-50%, -50%) scale(1) rotate(0); }
      80% { opacity: 1; transform: translate(-50%, -58%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -92%) scale(0.92); }
    }

    @keyframes ribbon-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-6deg); }
      22% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(2deg); }
      70% { opacity: 1; transform: translate(-50%, -78%) scale(1) rotate(0); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(0.96); }
    }

    @keyframes overlay-arrive {
      from { opacity: 0; transform: translateY(24px) scale(0.9) rotate(-1deg); }
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes button-shine {
      0%, 50% { left: -35%; }
      78%, 100% { left: 125%; }
    }

    /* ------------------------------------------------------ responsiveness - */
    @media (orientation: portrait) and (max-width: 760px) {
      .rotate-hint { display: block; }

      .play-area {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .left-panel {
        grid-column: 1;
        grid-row: 1;
        grid-template-rows: none;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: stretch;
      }

      .rocket-panel {
        min-height: 5.5rem;
      }

      .payload-panel {
        align-self: center;
      }

      .center-field {
        grid-column: 1;
        grid-row: 2;
      }

      .prime-pad {
        grid-column: 1;
        grid-row: 3;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }

      .ambient::before,
      .fx-particle,
      .confetti,
      .round-ribbon {
        display: none !important;
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      :root { --topbar-height: 3.25rem; }

      .topbar { min-height: var(--topbar-height); padding: 0.28rem 0.55rem; }
      .back-link { min-height: 2rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; }
      .title-rocket { display: none; }
      .game-title { font-size: 1rem; }
      .hud-chip { min-height: 2rem; padding: 0.2rem 0.45rem; }
      .sound-toggle { min-height: 2.1rem; padding-block: 0.2rem; }
      .control-label { display: none; }
      .message { bottom: 0.3rem; padding: 0.35rem 0.7rem; font-size: 0.75rem; }
      .overlay-card { max-height: 90%; padding: 0.85rem 1.3rem 1rem; }
      .overlay h2 { font-size: clamp(1.7rem, 7vh, 2.5rem); }
      .overlay-copy { margin: 0.45rem auto 0.65rem; font-size: 0.84rem; }
      .overlay-stats { margin-bottom: 0.6rem; }
      .primary-btn { min-height: 2.65rem; padding-block: 0.55rem; }
      .prime-btn { min-height: 2.4rem; }
      .pip { font-size: 0.8rem; }
      .launch-log { max-height: 6rem; }
    }

    @media (max-width: 470px) {
      .back-link { min-height: 2.1rem; padding: 0.32rem 0.56rem; font-size: 0.78rem; }
      .game-title { font-size: 1.03rem; }
      .control-label { display: none; }
      .sound-toggle { min-width: 2.4rem; min-height: 2.3rem; padding: 0.35rem; }
      .hud-chip { font-size: 0.62rem; }
      .hud-value { font-size: 0.9rem; }
      .overlay-card { padding: 1.2rem 1rem 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="game-app">
    <div class="ambient" aria-hidden="true">
      <span class="blob blob-one"></span>
      <span class="blob blob-two"></span>
      <span class="blob blob-three"></span>
      <span class="ambient-star">✦</span>
      <span class="ambient-star">✦</span>
      <span class="ambient-star">✦</span>
      <span class="ambient-star">✦</span>
    </div>

    <header class="topbar">
      <div class="brand">
        <a class="back-link" href="/" aria-label="Back to the MathArcade">← Arcade</a>
        <h1 class="game-title"><span class="title-rocket">🚀</span> Prime Factor Rocket</h1>
      </div>

      <div class="hud" aria-label="Game progress">
        <div class="hud-chip">
          <span>Rank</span>
          <strong class="hud-value rank-C" id="rank-value">C</strong>
        </div>
        <div class="hud-chip">
          <span>Round</span>
          <strong class="hud-value" id="round-value">1 / 3</strong>
        </div>
        <div class="hud-chip">
          <span>Payload</span>
          <strong class="hud-value" id="payload-count">1 / 12</strong>
        </div>
        <div class="hud-chip strikes" id="strikes-chip" hidden>
          <span>Strikes</span>
          <strong class="hud-value" id="strikes-value">0 / 3</strong>
        </div>
        <div class="hud-chip" id="score-chip">
          <span>Score</span>
          <strong class="hud-value" id="score-value">0</strong>
        </div>
      </div>

      <div class="controls">
        <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true" aria-label="Turn sound off">
          <span class="sound-icon" id="sound-icon" aria-hidden="true">♪</span>
          <span class="control-label" id="sound-label">Sound on</span>
        </button>
      </div>
    </header>

    <main class="game-stage" id="stage">
      <div class="timer" id="timer" hidden aria-label="Payload timer">
        <div class="timer-fill" id="timer-fill"></div>
        <span class="timer-text" id="timer-text">25</span>
      </div>

      <div class="play-area">
        <section class="left-panel" aria-label="Rocket and fuel">
          <div class="rocket-panel">
            <div class="fuel-gauge-wrap">
              <span class="fuel-label">Fuel</span>
              <div class="fuel-gauge" id="fuel-gauge" aria-hidden="true"></div>
            </div>
            <div class="rocket-holder" id="rocket-holder">
              <svg class="rocket-svg" viewBox="0 0 220 380" role="img" aria-label="Rocket on the launch pad">
                <g class="rocket-flame" aria-hidden="true">
                  <path class="flame-outer" d="M110 372 C86 330 91 296 110 268 C129 296 134 330 110 372 Z" />
                  <path class="flame-mid" d="M110 352 C96 324 99 300 110 282 C121 300 124 324 110 352 Z" />
                  <path class="flame-core" d="M110 334 C102 316 104 300 110 290 C116 300 118 316 110 334 Z" />
                </g>
                <path class="rocket-fin" d="M74 244 C54 272 46 304 50 326 L90 308 C91 284 86 260 74 244 Z" />
                <path class="rocket-fin" d="M146 244 C166 272 174 304 170 326 L130 308 C129 284 134 260 146 244 Z" />
                <path class="rocket-body" d="M110 16 C145 58 156 118 156 180 L156 258 C156 280 137 294 110 294 C83 294 64 280 64 258 L64 180 C64 118 75 58 110 16 Z" />
                <path class="rocket-nose" d="M110 16 C129 39 143 71 150 104 L70 104 C77 71 91 39 110 16 Z" />
                <circle class="rocket-window-ring" cx="110" cy="156" r="27" />
                <circle class="rocket-window" cx="110" cy="156" r="19" />
                <ellipse class="rocket-glint" cx="102" cy="148" rx="6.5" ry="4.2" />
                <path class="rocket-stripe" d="M64 208 L156 208 L156 232 L64 232 Z" />
              </svg>
              <div class="launch-pad" aria-hidden="true"></div>
            </div>
          </div>

          <div class="payload-panel">
            <span class="payload-panel-label">Launched</span>
            <div class="payload-meter" id="payload-meter" aria-hidden="true"></div>
          </div>
        </section>

        <section class="center-field" aria-label="Payload and factorization">
          <div class="payload-card" id="payload-card">
            <span class="payload-label">Payload</span>
            <strong class="payload-value" id="payload-value">–</strong>
            <span class="payload-remaining" id="payload-remaining" hidden>Left: <b id="payload-remaining-value"></b></span>
          </div>

          <div class="tree-area" id="tree-area">
            <svg class="tree-edges" id="tree-edges" aria-hidden="true"></svg>
          </div>

          <div class="tray-area" id="tray-area" hidden>
            <div class="tray-chips empty" id="tray-chips" aria-label="Selected primes"></div>
            <div class="tray-actions">
              <button class="clear-btn" id="clear-btn" type="button">Clear</button>
              <button class="submit-btn" id="submit-btn" type="button" disabled>Submit factorization</button>
            </div>
          </div>
        </section>

        <section class="prime-pad" id="prime-pad" aria-label="Prime buttons"></section>
      </div>

      <div class="effects" id="effects" aria-hidden="true"></div>
      <p class="message" id="message" role="status" aria-live="polite" aria-atomic="true"></p>
      <span class="rotate-hint">Tip: turn your device sideways for the best view!</span>

      <section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <div class="overlay-card">
          <span class="overlay-kicker" id="overlay-kicker">Prime factorization launchpad</span>
          <h2 id="overlay-title">Prime Factor Rocket!</h2>
          <p class="overlay-copy" id="overlay-copy"></p>
          <div id="overlay-extra"></div>
          <div class="overlay-stats" id="overlay-stats" hidden>
            <div class="overlay-stat">
              <strong id="round-points">0</strong>
              <span>Round points</span>
            </div>
            <div class="overlay-stat">
              <strong id="session-points">0</strong>
              <span>Session total</span>
            </div>
          </div>
          <button class="primary-btn" id="overlay-action" type="button">Start fueling</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/primerocket.js"></script>
</body>
</html>
