<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Dino Dash · MathArcade Daily Bonus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bn-bg: #170c2a;
      --bn-gold: #ffd166;
      --bn-pink: #ff5e7d;
      --bn-mint: #63e6be;
      --bn-text: #fdf3ff;
      --bn-dim: #b39ac4;
      --bn-danger: #ff3b5c;
      --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
      --font-body: "Nunito", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--bn-bg);
      color: var(--bn-text);
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ------------------------------------------------------------ topbar */
    .bn-topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 1rem;
      background: rgba(23, 12, 42, 0.95);
      border-bottom: 1px solid rgba(255, 209, 102, 0.25);
      z-index: 100;
      position: relative;
    }

    .bn-left {
      display: flex;
      align-items: baseline;
      gap: 0.85rem;
      min-width: 0;
    }

    .back-link {
      color: var(--bn-dim);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .back-link:hover { color: var(--bn-gold); }

    .game-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 3vw, 1.55rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      background: linear-gradient(90deg, var(--bn-gold), var(--bn-pink), var(--bn-mint));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    .bonus-tag {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--bn-gold);
      border: 1px dashed rgba(255, 209, 102, 0.55);
      border-radius: 999px;
      padding: 0.14rem 0.55rem;
      white-space: nowrap;
    }

    .hud {
      display: flex;
      gap: 0.45rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    .hud-chip {
      background: rgba(255, 94, 125, 0.1);
      border: 1px solid rgba(255, 209, 102, 0.3);
      border-radius: 999px;
      padding: 0.32rem 0.75rem;
      font-weight: 800;
      font-size: 0.82rem;
      color: var(--bn-text);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .hud-chip .val { color: var(--bn-gold); }
    .hud-chip.best-chip .val { color: var(--bn-mint); }

    .hud-chip.pop { animation: chipPop 0.35s ease; }

    @keyframes chipPop {
      40% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }

    /* ------------------------------------------------------------- stage */
    .bn-stage-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bn-bg);
    }

    #game-canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

    /* danger vignette on crash */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 24;
      opacity: 0;
      transition: opacity 0.25s ease;
      box-shadow: inset 0 0 130px 35px rgba(255, 40, 60, 0.6);
    }

    #vignette.on { opacity: 1; }

    /* ------------------------------------------------------------- FX */
    #fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .float-text {
      position: absolute;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--bn-gold);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      animation: floatUp 0.95s ease-out forwards;
      pointer-events: none;
      white-space: nowrap;
    }

    .float-text.bad { color: var(--bn-danger); font-size: 1.6rem; }
    .float-text.big { font-size: 2.2rem; color: #fff; }
    .float-text.combo { color: var(--bn-mint); font-size: 1.7rem; }

    @keyframes floatUp {
      0%   { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
      20%  { transform: translate(-50%, -12px) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -80px) scale(1); opacity: 0; }
    }

    .screen-flash {
      position: absolute;
      inset: 0;
      background: rgba(255, 230, 150, 0.3);
      opacity: 0;
      pointer-events: none;
      z-index: 25;
    }

    .screen-flash.go { animation: flashPop 0.35s ease; }
    .screen-flash.bad { background: rgba(255, 40, 60, 0.35); }

    @keyframes flashPop {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }

    /* --------------------------------------------------- touch controls */
    .touch-btn {
      position: absolute;
      bottom: 18px;
      z-index: 40;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid rgba(255, 209, 102, 0.5);
      background: rgba(23, 12, 42, 0.55);
      color: var(--bn-gold);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.15rem;
      touch-action: none;
      backdrop-filter: blur(3px);
    }

    .touch-btn:active {
      background: rgba(255, 209, 102, 0.25);
      transform: scale(0.94);
    }

    .touch-btn .arrow { font-size: 1.5rem; line-height: 1; }

    #btn-jump { right: 18px; }
    #btn-duck { left: 18px; color: var(--bn-mint); border-color: rgba(99, 230, 190, 0.5); }

    @media (pointer: coarse) {
      .touch-btn { display: flex; }
    }

    /* --------------------------------------------------------- overlay */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255, 94, 125, 0.22), transparent 55%),
        rgba(12, 6, 24, 0.82);
      backdrop-filter: blur(4px);
    }

    .overlay.hidden { display: none; }

    .overlay-card {
      width: min(540px, 100%);
      max-height: min(92vh, 700px);
      overflow: auto;
      background: linear-gradient(165deg, rgba(52, 26, 78, 0.96), rgba(24, 11, 42, 0.98));
      border: 1px solid rgba(255, 209, 102, 0.35);
      border-radius: 22px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(255, 100, 140, 0.18);
      padding: 1.4rem 1.35rem 1.5rem;
      text-align: center;
    }

    .overlay-card h2 {
      margin: 0 0 0.4rem;
      font-family: var(--font-display);
      font-size: clamp(1.55rem, 4vw, 2rem);
      background: linear-gradient(90deg, var(--bn-gold), var(--bn-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .overlay-card p {
      margin: 0 0 1rem;
      color: var(--bn-dim);
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .overlay-card p strong { color: var(--bn-text); }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 0 0 1.1rem;
    }

    .control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--bn-dim);
    }

    .control .key {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--bn-text);
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.35);
      border-radius: 10px;
      padding: 0.35rem 0.7rem;
    }

    .btn {
      display: inline-block;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 1.4rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

    .btn-primary {
      background: linear-gradient(180deg, var(--bn-gold), #ff9d4a);
      color: #2a1204;
      box-shadow: 0 4px 0 #a85a12, 0 0 20px rgba(255, 190, 80, 0.35);
    }

    .btn-ghost {
      background: transparent;
      color: var(--bn-dim);
      border: 1px solid rgba(179, 154, 196, 0.35);
      margin-top: 0.35rem;
      font-size: 0.9rem;
      padding: 0.55rem 1.1rem;
    }

    .hint-line {
      margin: 0.55rem 0 0.4rem !important;
      font-size: 0.78rem !important;
    }

    .end-stats {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 0.85rem 0 1.1rem;
    }

    .end-stat {
      background: rgba(255, 94, 125, 0.1);
      border: 1px solid rgba(255, 209, 102, 0.28);
      border-radius: 12px;
      padding: 0.55rem 0.9rem;
      min-width: 90px;
    }

    .end-stat .lbl {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--bn-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .end-stat .num {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--bn-gold);
    }

    .best-banner {
      margin: 0.5rem 0 0.85rem;
      padding: 0.55rem 0.85rem;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(99, 230, 190, 0.16), rgba(255, 209, 102, 0.2));
      border: 1px solid rgba(99, 230, 190, 0.5);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--bn-mint);
      animation: bannerPop 0.6s ease;
    }

    @keyframes bannerPop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 560px) {
      .bonus-tag { display: none; }
      .hud-chip.speed-chip { display: none; }
    }
  </style>
</head>
<body>
  <div class="bn-topbar">
    <div class="bn-left">
      <a class="back-link" href="/">← Arcade</a>
      <h1 class="game-title">Dino Dash</h1>
      <span class="bonus-tag">DAILY BONUS</span>
    </div>
    <div class="hud">
      <div class="hud-chip speed-chip">Speed <span class="val" id="speed-label">1.0×</span></div>
      <div class="hud-chip best-chip">HI <span class="val" id="best">00000</span></div>
      <div class="hud-chip" id="score-chip">Score <span class="val" id="score">00000</span></div>
    </div>
  </div>

  <div class="bn-stage-wrap">
    <div id="stage">
      <canvas id="game-canvas"></canvas>

      <div id="fx-layer"></div>
      <div id="vignette"></div>
      <div class="screen-flash" id="flash"></div>

      <button type="button" class="touch-btn" id="btn-duck" aria-label="Duck">
        <span class="arrow">▼</span>DUCK
      </button>
      <button type="button" class="touch-btn" id="btn-jump" aria-label="Jump">
        <span class="arrow">▲</span>JUMP
      </button>

      <div class="overlay" id="overlay">
        <div class="overlay-card" id="overlay-card">
          <h2>Dino Dash</h2>
          <p>Loading…</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/bonus.js"></script>
</body>
</html>
