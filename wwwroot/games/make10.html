<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Make 10 · MathArcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --m10-bg: #070b14;
      --m10-cyan: #22d3ee;
      --m10-blue: #4f7cff;
      --m10-purple: #a855f7;
      --m10-text: #dbeafe;
      --m10-dim: #64748b;
      --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
      --font-body: "Nunito", system-ui, sans-serif;
    }

    * , *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--m10-bg);
      color: var(--m10-text);
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .m10-topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: rgba(7, 11, 20, 0.9);
      border-bottom: 1px solid rgba(34, 211, 238, 0.15);
      z-index: 10;
    }

    .m10-left {
      display: flex;
      align-items: baseline;
      gap: 0.9rem;
      min-width: 0;
    }

    .back-link {
      color: var(--m10-dim);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .back-link:hover { color: var(--m10-cyan); }

    .game-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--m10-cyan), var(--m10-blue), var(--m10-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    .hud {
      display: flex;
      gap: 0.5rem;
      flex-wrap: nowrap;
    }

    .hud-chip {
      background: rgba(34, 211, 238, 0.07);
      border: 1px solid rgba(34, 211, 238, 0.22);
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--m10-text);
      white-space: nowrap;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .hud-chip .val { color: var(--m10-cyan); }
    .hud-chip .val.rank-C { color: #c8c8d0; }
    .hud-chip .val.rank-B { color: #7dffa8; }
    .hud-chip .val.rank-A { color: #9ec5ff; }
    .hud-chip .val.rank-S { color: var(--m10-cyan); }

    .hud-chip.hot {
      border-color: rgba(34, 211, 238, 0.7);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.35), inset 0 0 8px rgba(34, 211, 238, 0.12);
    }

    .hud-chip.timer-warn {
      border-color: rgba(251, 146, 60, 0.75);
      box-shadow: 0 0 12px rgba(251, 146, 60, 0.4);
      animation: timer-pulse 0.9s ease-in-out infinite;
    }
    .hud-chip.timer-warn .val { color: #fb923c; }
    .hud-chip.timer-critical {
      border-color: rgba(255, 77, 94, 0.85);
      box-shadow: 0 0 14px rgba(255, 77, 94, 0.5);
      animation: timer-pulse 0.45s ease-in-out infinite;
    }
    .hud-chip.timer-critical .val { color: #ff4d5e; }

    @keyframes timer-pulse {
      50% { transform: scale(1.04); }
    }

    .m10-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    #timer-curtain {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 0%;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(
        180deg,
        rgba(34, 211, 238, 0.34) 0%,
        rgba(34, 211, 238, 0.18) 70%,
        rgba(34, 211, 238, 0) 100%
      );
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    #timer-curtain.visible { opacity: 1; }

    #timer-curtain.warn {
      background: linear-gradient(
        180deg,
        rgba(251, 146, 60, 0.42) 0%,
        rgba(251, 146, 60, 0.22) 70%,
        rgba(251, 146, 60, 0) 100%
      );
    }

    #timer-curtain.critical {
      background: linear-gradient(
        180deg,
        rgba(255, 77, 94, 0.5) 0%,
        rgba(255, 77, 94, 0.28) 70%,
        rgba(255, 77, 94, 0) 100%
      );
    }

    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 40%, rgba(79, 124, 255, 0.12), transparent 60%), rgba(7, 11, 20, 0.82);
      backdrop-filter: blur(3px);
      z-index: 5;
    }

    .overlay.hidden { display: none; }

    .overlay h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f0faff;
      text-shadow: 0 0 18px rgba(34, 211, 238, 0.7), 0 0 48px rgba(79, 124, 255, 0.4);
    }

    .overlay p {
      margin: 0;
      max-width: 34ch;
      font-size: 1.05rem;
      color: #94a3b8;
      font-weight: 600;
      line-height: 1.5;
    }

    .overlay .stat-line {
      color: var(--m10-cyan);
      font-weight: 800;
      font-size: 1.15rem;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      padding: 0.12rem 0.45rem;
      border-radius: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      border: 1px solid transparent;
    }

    .rank-C { background: rgba(140, 140, 150, 0.25); color: #c8c8d0; border-color: rgba(180, 180, 190, 0.4); }
    .rank-B { background: rgba(80, 180, 120, 0.2); color: #7dffa8; border-color: rgba(80, 220, 140, 0.45); }
    .rank-A { background: rgba(80, 140, 255, 0.22); color: #9ec5ff; border-color: rgba(100, 160, 255, 0.5); }
    .rank-S {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.3), rgba(79, 124, 255, 0.35));
      color: var(--m10-cyan);
      border-color: rgba(34, 211, 238, 0.65);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.4);
      animation: sGlow 1.8s ease-in-out infinite;
    }

    @keyframes sGlow {
      50% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.7); }
    }

    .rank-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 0.75rem;
      margin: 0.35rem auto;
      font-size: 0.78rem;
      color: var(--m10-dim);
      max-width: 42ch;
    }

    .rank-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }

    .rank-up-banner {
      margin: 0.35rem auto;
      padding: 0.55rem 0.95rem;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.15), rgba(79, 124, 255, 0.22));
      border: 1px solid rgba(34, 211, 238, 0.45);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--m10-cyan);
      animation: rankPop 0.6s ease;
    }

    @keyframes rankPop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    #overlay-extra {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-align: center;
    }

    .end-stats {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 0.5rem auto;
    }

    .end-stat {
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 12px;
      padding: 0.55rem 0.9rem;
      min-width: 90px;
      text-align: center;
    }

    .end-stat .lbl {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--m10-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .end-stat .num {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--m10-cyan);
    }

    .end-stat .num.rank-C { color: #c8c8d0; }
    .end-stat .num.rank-B { color: #7dffa8; }
    .end-stat .num.rank-A { color: #9ec5ff; }
    .end-stat .num.rank-S { color: var(--m10-cyan); }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 0.8rem 2.2rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      color: #06121a;
      background: linear-gradient(135deg, var(--m10-cyan), var(--m10-blue));
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.45), 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 28px rgba(34, 211, 238, 0.65), 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    .btn:active { transform: translateY(0) scale(0.98); }

    .btn-ghost {
      background: transparent;
      color: var(--m10-dim);
      border: 1px solid rgba(100, 116, 139, 0.4);
      box-shadow: none;
      font-size: 0.9rem;
      padding: 0.45rem 1.1rem;
    }

    .btn-ghost:hover {
      color: var(--m10-text);
      border-color: rgba(34, 211, 238, 0.5);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
    }

    .overlay-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .overlay-actions a.btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .overlay-actions a.btn.hidden,
    .overlay-actions .btn.hidden {
      display: none;
    }

    .overlay-actions a.btn[aria-disabled="true"] {
      opacity: 0.55;
      pointer-events: none;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="m10-topbar">
    <div class="m10-left">
      <a class="back-link" href="/">← Arcade</a>
      <h1 class="game-title">MAKE 10</h1>
    </div>
    <div class="hud">
      <div class="hud-chip">Score <span class="val" id="score">0</span></div>
      <div class="hud-chip">Circuit <span class="val" id="circuit">–</span></div>
      <div class="hud-chip">Rank <span class="val rank-C" id="rank-label">C</span></div>
      <div class="hud-chip" id="timer-chip" hidden>Time <span class="val" id="circuit-timer">–</span></div>
      <div class="hud-chip" id="streak-chip">Streak <span class="val" id="streak">0</span></div>
      <div class="hud-chip">Best <span class="val" id="best">0</span></div>
      <button class="btn btn-ghost" id="end-btn">End</button>
    </div>
  </div>
  <div class="m10-stage" id="stage">
    <canvas id="game-canvas"></canvas>
    <div id="timer-curtain" aria-hidden="true"></div>
    <div class="overlay" id="overlay">
      <h2>MAKE 10</h2>
      <p>A live wire hums on the left. Guide its free end to the number that adds with the base to make <strong>10</strong>. Complete <strong>10 circuits</strong> to rank up. Higher ranks pack the field and tighten the snap.</p>
      <div id="overlay-extra"></div>
      <p id="overlay-stats" class="stat-line" hidden></p>
      <div class="overlay-actions">
        <button class="btn" id="start-btn">Power up</button>
        <a class="btn btn-ghost hidden" id="home-btn" href="/">Back to arcade</a>
      </div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/make10.js"></script>
</body>
</html>
