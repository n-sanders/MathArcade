<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Feed the Cats · MathArcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cats-bg: #1a120e;
      --cats-panel: #2a1c16;
      --cats-cream: #fff3e0;
      --cats-gold: #f2c84b;
      --cats-orange: #e78438;
      --cats-teal: #2f8eaa;
      --cats-teal-light: #72c4d3;
      --cats-text: #fff8ee;
      --cats-dim: #b89a82;
      --cats-red: #ff6b6b;
      --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
      --font-body: "Nunito", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--cats-bg);
      color: var(--cats-text);
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .cats-topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 1rem;
      background: rgba(26, 18, 14, 0.94);
      border-bottom: 1px solid rgba(242, 200, 75, 0.18);
      z-index: 10;
    }

    .cats-left {
      display: flex;
      align-items: baseline;
      gap: 0.9rem;
      min-width: 0;
    }

    .back-link {
      color: var(--cats-dim);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .back-link:hover { color: var(--cats-gold); }

    .game-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 3vw, 1.5rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--cats-cream);
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
    }

    .hud-chip {
      background: rgba(255, 243, 224, 0.08);
      border: 1px solid rgba(242, 200, 75, 0.22);
      border-radius: 999px;
      padding: 0.28rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--cats-dim);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hud-chip .val { color: var(--cats-gold); text-transform: none; letter-spacing: 0; font-size: 0.95rem; }

    .hud-chip .val.rank-C { color: #c8c8d0; }
    .hud-chip .val.rank-B { color: #7dffa8; }
    .hud-chip .val.rank-A { color: #9ec5ff; }
    .hud-chip .val.rank-S { color: var(--cats-gold); }

    .hud-chip.timer-warn {
      border-color: rgba(231, 132, 56, 0.7);
      animation: timer-pulse 0.9s ease-in-out infinite;
    }
    .hud-chip.timer-warn .val { color: var(--cats-orange); }
    .hud-chip.timer-critical {
      border-color: rgba(255, 107, 107, 0.8);
      animation: timer-pulse 0.45s ease-in-out infinite;
    }
    .hud-chip.timer-critical .val { color: var(--cats-red); }

    @keyframes timer-pulse {
      50% { box-shadow: 0 0 12px rgba(242, 200, 75, 0.35); }
    }

    .cats-stage {
      flex: 1;
      position: relative;
      min-height: 0;
      display: flex;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(47, 142, 170, 0.18), transparent 45%),
        radial-gradient(ellipse at 80% 100%, rgba(231, 132, 56, 0.16), transparent 50%),
        linear-gradient(180deg, #241610 0%, #1a120e 100%);
    }

    .cats-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(150px, 22%) 1fr;
      gap: 0.85rem;
      padding: 0.7rem 1rem 1rem;
      min-height: 0;
      min-width: 0;
    }

    .hand {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.7rem;
      min-height: 0;
    }

    .card {
      appearance: none;
      border: 3px solid rgba(242, 200, 75, 0.45);
      border-radius: 18px;
      background: linear-gradient(180deg, #fff8ee, #f3d7a4);
      color: #3b3331;
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vh, 2.6rem);
      font-weight: 700;
      min-height: 4.4rem;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .card:hover { transform: translateY(-2px) scale(1.02); }
    .card.selected, .cats-stage.picking .card.selected {
      border-color: var(--cats-teal-light);
      box-shadow: 0 0 0 3px rgba(114, 196, 211, 0.45), 0 10px 22px rgba(0, 0, 0, 0.4);
      transform: translateY(-4px) scale(1.05);
    }
    .card.dragging { opacity: 0.35; }

    .stations {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
      min-width: 0;
      min-height: 0;
    }

    .station {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      border-radius: 22px;
      padding: 0.35rem 0.35rem 0.7rem;
      background: rgba(255, 243, 224, 0.04);
      border: 1px solid rgba(255, 243, 224, 0.08);
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .station.hot {
      border-color: rgba(114, 196, 211, 0.7);
      background: rgba(47, 142, 170, 0.16);
    }

    .station.idle { opacity: 0.72; }
    .station.idle .fact { visibility: hidden; }

    .cat-wrap {
      flex: 1 1 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      min-height: 0;
    }

    .cat-wrap svg.recolorable-cat {
      width: 100%;
      height: 100%;
      max-height: 52vh;
      overflow: visible;
    }

    .fact {
      margin-top: 0.15rem;
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      display: grid;
      justify-items: end;
      min-width: 4.8rem;
      color: var(--cats-cream);
    }

    .fact-top {
      font-size: clamp(1.5rem, 4.2vh, 2.2rem);
      font-weight: 700;
      line-height: 1;
      padding-right: 0.35rem;
    }

    .fact-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .minus {
      font-size: clamp(1.3rem, 3.6vh, 1.9rem);
      font-weight: 700;
    }

    .fact-blank {
      appearance: none;
      width: 2.5rem;
      height: 2.2rem;
      border-radius: 10px;
      border: 2px dashed rgba(242, 200, 75, 0.7);
      background: rgba(26, 18, 14, 0.55);
      color: var(--cats-gold);
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: none;
    }

    .cats-stage.picking .fact-blank {
      animation: blank-pulse 1s ease-in-out infinite;
    }

    @keyframes blank-pulse {
      50% { border-color: var(--cats-teal-light); background: rgba(47, 142, 170, 0.28); }
    }

    .fact-rule {
      width: 100%;
      height: 3px;
      margin: 0.2rem 0 0.15rem;
      background: var(--cats-cream);
      border-radius: 2px;
      opacity: 0.85;
    }

    .fact-diff {
      font-size: clamp(1.4rem, 4vh, 2rem);
      font-weight: 700;
      padding-right: 0.35rem;
      line-height: 1;
      color: var(--cats-gold);
    }

    .fact.complete .fact-blank {
      border-style: solid;
      border-color: var(--cats-teal-light);
      background: rgba(47, 142, 170, 0.25);
    }

    .station.shake { animation: station-shake 0.4s ease; }
    @keyframes station-shake {
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    #effects {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 8;
    }

    .fx-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: burst 0.65s ease-out forwards;
    }
    @keyframes burst {
      to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
    }

    .confetti {
      position: absolute;
      top: -12px;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      animation: confetti-fall 1.5s linear forwards;
    }
    @keyframes confetti-fall {
      from { transform: translate3d(0, -20px, 0) rotate(var(--start-rotation)); opacity: 1; }
      to { transform: translate3d(var(--drift), 115vh, 0) rotate(var(--end-rotation)); opacity: 0.9; }
    }

    .ribbon {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      z-index: 11;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      padding: 0.85rem 1.4rem;
      border-radius: 16px;
      background: rgba(26, 18, 14, 0.88);
      border: 1px solid rgba(242, 200, 75, 0.45);
      animation: ribbon-pop 1.55s ease forwards;
      pointer-events: none;
    }
    .ribbon strong {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--cats-gold);
    }
    .ribbon span { color: var(--cats-dim); font-weight: 700; }
    @keyframes ribbon-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      14% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -62%) scale(0.94); }
    }

    #drag-ghost {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      width: 3.4rem;
      height: 3.4rem;
      margin: -1.7rem 0 0 -1.7rem;
      border-radius: 14px;
      border: 3px solid var(--cats-teal-light);
      background: linear-gradient(180deg, #fff8ee, #f3d7a4);
      color: #3b3331;
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
    }
    #drag-ghost[hidden] { display: none; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 40%, rgba(242, 200, 75, 0.12), transparent 60%), rgba(26, 18, 14, 0.86);
      backdrop-filter: blur(3px);
      z-index: 12;
    }
    .overlay.hidden { display: none; }
    .overlay h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 6.5vw, 3rem);
      font-weight: 700;
      color: #fff8e7;
      text-shadow: 0 0 18px rgba(242, 200, 75, 0.55);
    }
    .overlay p {
      margin: 0;
      max-width: 42ch;
      font-size: 1.05rem;
      color: var(--cats-dim);
      font-weight: 600;
      line-height: 1.5;
    }
    .overlay .stat-line {
      color: var(--cats-gold);
      font-weight: 800;
      font-size: 1.15rem;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      padding: 0.12rem 0.45rem;
      border-radius: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      border: 1px solid transparent;
    }
    .rank-C { background: rgba(140, 140, 150, 0.25); color: #c8c8d0; border-color: rgba(180, 180, 190, 0.4); }
    .rank-B { background: rgba(80, 180, 120, 0.2); color: #7dffa8; border-color: rgba(80, 220, 140, 0.45); }
    .rank-A { background: rgba(80, 140, 255, 0.22); color: #9ec5ff; border-color: rgba(100, 160, 255, 0.5); }
    .rank-S {
      background: linear-gradient(135deg, rgba(255, 200, 60, 0.3), rgba(255, 100, 40, 0.35));
      color: var(--cats-gold);
      border-color: rgba(255, 209, 102, 0.65);
      box-shadow: 0 0 12px rgba(255, 180, 40, 0.35);
      animation: sGlow 1.8s ease-in-out infinite;
    }
    @keyframes sGlow { 50% { box-shadow: 0 0 20px rgba(255, 180, 40, 0.65); } }

    .rank-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 0.75rem;
      margin: 0.25rem 0 0.35rem;
      font-size: 0.78rem;
      color: var(--cats-dim);
      max-width: 46ch;
    }
    .rank-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }

    .rank-up-banner {
      margin: 0.15rem 0;
      padding: 0.55rem 0.95rem;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(242, 200, 75, 0.15), rgba(231, 132, 56, 0.22));
      border: 1px solid rgba(242, 200, 75, 0.45);
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--cats-gold);
      animation: rankPop 0.6s ease;
    }
    @keyframes rankPop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    .end-stats {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 0.35rem 0 0.15rem;
    }
    .end-stat {
      background: rgba(242, 200, 75, 0.08);
      border: 1px solid rgba(242, 200, 75, 0.25);
      border-radius: 12px;
      padding: 0.55rem 0.9rem;
      min-width: 90px;
    }
    .end-stat .lbl {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--cats-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .end-stat .num {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--cats-gold);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 0.8rem 2.2rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      color: #1a1206;
      background: linear-gradient(135deg, var(--cats-gold), var(--cats-orange));
      box-shadow: 0 0 18px rgba(242, 200, 75, 0.4), 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 28px rgba(242, 200, 75, 0.6), 0 6px 18px rgba(0, 0, 0, 0.5);
    }
    .btn:active { transform: translateY(0) scale(0.98); }
    .btn-ghost {
      background: transparent;
      color: var(--cats-dim);
      border: 1px solid rgba(184, 154, 130, 0.4);
      box-shadow: none;
      font-size: 0.9rem;
      padding: 0.45rem 1.1rem;
    }
    .btn-ghost:hover {
      color: var(--cats-text);
      border-color: rgba(242, 200, 75, 0.5);
    }

    @media (max-width: 760px), (orientation: portrait) {
      .cats-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
      .stations { order: 1; }
      .hand {
        order: 2;
        flex-direction: row;
        justify-content: center;
      }
      .card {
        flex: 1 1 0;
        max-width: 7rem;
        min-height: 3.6rem;
        font-size: 1.8rem;
      }
      .cat-wrap svg.recolorable-cat { max-height: 38vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fx-particle, .confetti, .ribbon { display: none !important; }
      .station.shake, .hud-chip.timer-warn, .hud-chip.timer-critical, .rank-S { animation: none; }
      .cats-stage.picking .fact-blank { animation: none; }
    }
  </style>
</head>
<body>
  <div class="cats-topbar">
    <div class="cats-left">
      <a class="back-link" href="/">← Arcade</a>
      <h1 class="game-title">FEED THE CATS</h1>
    </div>
    <div class="hud">
      <div class="hud-chip">Score <span class="val" id="score">0</span></div>
      <div class="hud-chip">Rank <span class="val rank-C" id="rank-label">C</span></div>
      <div class="hud-chip">Round <span class="val" id="round">–</span></div>
      <div class="hud-chip">Fed <span class="val" id="fed">0/12</span></div>
      <div class="hud-chip" id="timer-chip" hidden>Time <span class="val" id="timer">–</span></div>
      <div class="hud-chip">Best <span class="val" id="best">0</span></div>
      <button class="btn btn-ghost" id="end-btn">End</button>
    </div>
  </div>
  <div class="cats-stage" id="stage">
    <div class="cats-layout">
      <div class="hand" id="hand" aria-label="Number cards"></div>
      <div class="stations" id="stations" aria-label="Cat stations"></div>
    </div>
    <div id="effects"></div>
    <div class="overlay" id="overlay">
      <h2>FEED THE CATS</h2>
      <p id="overlay-text">The missing number is half of the top. Feed the cats 12 doubles to clear a round.</p>
      <div id="overlay-extra"></div>
      <button class="btn" id="start-btn">Feed the cats</button>
    </div>
  </div>
  <div id="drag-ghost" hidden></div>
  <template id="cat-template">
<!--
  RECOLORABLE CAT

  Quick recoloring:
    1. Change data-palette on the <svg> element to one of:
       calico | ginger-tabby | tuxedo | gray-tabby | siamese | fantasy
    2. For a portable custom coloring, set data-palette="custom" and edit the
       clearly labeled CUSTOM PALETTE block near the end of the stylesheet.
    3. For live webpage variables, set data-palette="variables" and override the
       cat custom properties on this SVG from CSS.

  Pattern layers are independent from paint colors. Their opacity controls let
  one drawing become a patched, striped, pointed, socked, or solid-colored cat.

  Expression:
    Change data-expression on the <svg> element between "neutral" and "happy".
    When the SVG is inline, changing the attribute crossfades the face layers.

  For CSS control from a web page, inline this SVG in the HTML. CSS variables on
  the host page do not normally cross into an SVG loaded through an <img> tag.
  If literal inline copies share one document, give each recolorable-cat ID prefix
  a unique suffix. Separate copies loaded through <img> are already isolated.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  class="recolorable-cat"
  data-palette="calico"
  data-expression="neutral"
  viewBox="0 0 800 800"
  width="800"
  height="800"
  role="img"
  aria-label="A sitting cat with customizable colors and expression"
>
  <title>A sitting cat with customizable colors and expression</title>
  <desc>
    A friendly sitting cat with a curled tail, bright eyes, a collar, and color layers
    that can be changed through CSS custom properties and built-in palette presets.
    Its face can crossfade between neutral and happy expressions.
  </desc>

  <style>
    /* Default palette: calico. All painted colors live in palette declarations. */
    svg.recolorable-cat {
      --cat-fur-base: #f2d3a7;
      --cat-fur-shadow: #d4aa78;
      --cat-patch-one: #e78438;
      --cat-patch-two: #3e4247;
      --cat-light-fur: #fff7ea;
      --cat-stripe: #6c3c25;
      --cat-point: #58453d;
      --cat-inner-ear: #e7aaa7;
      --cat-eye: #71ad6f;
      --cat-pupil: #1d2224;
      --cat-eye-glint: #ffffff;
      --cat-nose: #b85f6c;
      --cat-mouth: #6a4045;
      --cat-outline: #3b3331;
      --cat-whisker: #514846;
      --cat-collar: #2f8eaa;
      --cat-collar-light: #72c4d3;
      --cat-tag: #f2c84b;
      --cat-tag-light: #fff1a3;
      --cat-ground-shadow: #3b3030;

      --cat-patches-opacity: 1;
      --cat-stripes-opacity: 0.28;
      --cat-socks-opacity: 1;
      --cat-blaze-opacity: 0.7;
      --cat-points-opacity: 0;
      --cat-tail-tip-opacity: 1;
      --cat-shadow-opacity: 0.18;
      --cat-outline-width: 10px;
      --cat-feature-width: 7px;
    }

    svg.recolorable-cat[data-palette="ginger-tabby"] {
      --cat-fur-base: #e99a43;
      --cat-fur-shadow: #c96f2a;
      --cat-patch-one: #e99a43;
      --cat-patch-two: #e99a43;
      --cat-light-fur: #ffe1b6;
      --cat-stripe: #8a471d;
      --cat-point: #8a471d;
      --cat-inner-ear: #e9a095;
      --cat-eye: #8fb660;
      --cat-pupil: #1c201e;
      --cat-eye-glint: #ffffff;
      --cat-nose: #ad5960;
      --cat-mouth: #6e3e36;
      --cat-outline: #543724;
      --cat-whisker: #6c4a36;
      --cat-collar: #3f86c8;
      --cat-collar-light: #83b9e7;
      --cat-tag: #f1c84b;
      --cat-tag-light: #fff1a3;
      --cat-ground-shadow: #4b3025;
      --cat-patches-opacity: 0;
      --cat-stripes-opacity: 0.95;
      --cat-socks-opacity: 0.52;
      --cat-blaze-opacity: 0.12;
