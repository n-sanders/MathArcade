<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prime Search · MathArcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/games.css" />
  <style>
    .prime-stage {
      position: relative;
      min-height: 460px;
      border-radius: 16px;
      overflow: hidden;
      background: #0a1f26;
      cursor: none;
    }
    .prime-stage.preview {
      cursor: default;
      background: #e8f7f4;
    }
    .targets-preview {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 2.5rem 1rem 1rem;
      flex-wrap: wrap;
    }
    .target-chip {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      background: #ffd166;
      color: #102a32;
      box-shadow: 0 8px 0 #e0b84a;
    }
    .field {
      position: absolute;
      inset: 0;
      display: grid;
      gap: 8px;
      padding: 12px;
      grid-template-columns: repeat(var(--cols, 6), 1fr);
    }
    .num-cell {
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(232, 247, 244, 0.12);
      color: #e8f7f4;
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 2.5vw, 1.25rem);
      font-weight: 700;
      user-select: none;
      border: 2px solid transparent;
    }
    .num-cell.found {
      background: rgba(26, 122, 76, 0.85);
      border-color: #7dcea0;
    }
    .flashlight {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle 90px at var(--mx, 50%) var(--my, 50%),
        transparent 0%,
        transparent 35%,
        rgba(0, 0, 0, 0.82) 55%,
        rgba(0, 0, 0, 0.94) 100%
      );
      z-index: 2;
    }
    .prime-stage.preview .flashlight,
    .prime-stage.preview .field {
      display: none;
    }
    .hunt-hint {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      background: rgba(232, 247, 244, 0.9);
      color: #102a32;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.85rem;
      pointer-events: none;
    }
  </style>
</head>
<body class="game-page">
  <div class="game-shell">
    <div class="game-top">
      <a class="back-link" href="/">← Arcade</a>
      <h1 class="game-title">Prime Search</h1>
      <div class="hud">
        <div class="hud-chip" id="score">Score: 0</div>
        <div class="hud-chip" id="found">Found: 0/3</div>
        <div class="hud-chip" id="level">Level: 1</div>
      </div>
    </div>
    <div class="game-stage" style="padding: 0.75rem;">
      <div class="overlay" id="overlay">
        <h2>Prime Search</h2>
        <p>Memorize three primes. When the lights go out, use your flashlight cursor to find them in the field.</p>
        <button class="btn btn-primary" id="start-btn">Start hunt</button>
      </div>
      <div class="prime-stage preview" id="stage">
        <p class="prompt-label" id="mem-label" style="padding-top:1.5rem;color:#4a6b74;">Memorize these primes!</p>
        <div class="targets-preview" id="preview-targets"></div>
        <div class="field" id="field"></div>
        <div class="flashlight" id="flashlight"></div>
        <div class="hunt-hint hidden" id="hint">Find the primes</div>
      </div>
      <p class="message" id="message"></p>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/primesearch.js"></script>
</body>
</html>
