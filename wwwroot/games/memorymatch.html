<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#8f62ff" />
  <title>Memory Match Math · MathArcade</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #39245b;
      --ink-soft: #674f86;
      --purple: #7c4dff;
      --purple-deep: #5b2bd7;
      --pink: #ff5ea8;
      --coral: #ff7b6b;
      --yellow: #ffd84d;
      --cyan: #37d8e6;
      --green: #52d68b;
      --cream: #fffaf0;
      --paper: rgba(255, 255, 255, 0.86);
      --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
      --font-body: "Nunito", system-ui, sans-serif;
      --topbar-height: 4.15rem;
      --card-size: 120px;
      --grid-gap: 10px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 216, 77, 0.8), transparent 24%),
        radial-gradient(circle at 88% 82%, rgba(55, 216, 230, 0.65), transparent 28%),
        linear-gradient(135deg, #fff2a8 0%, #ffc7e3 40%, #bba8ff 72%, #83e9ef 100%);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button,
    a {
      font: inherit;
    }

    .game-app {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.34;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 2px, transparent 2.5px),
        radial-gradient(circle, rgba(124, 77, 255, 0.3) 0 1.5px, transparent 2px);
      background-position: 0 0, 22px 24px;
      background-size: 48px 48px;
      animation: drift-pattern 24s linear infinite;
    }

    .blob {
      position: absolute;
      width: clamp(12rem, 26vw, 28rem);
      aspect-ratio: 1;
      border-radius: 42% 58% 63% 37% / 48% 34% 66% 52%;
      filter: blur(1px);
      opacity: 0.48;
      animation: blob-float 12s ease-in-out infinite alternate;
    }

    .blob-one {
      top: -11%;
      left: -7%;
      background: linear-gradient(145deg, var(--yellow), #ff9d5c);
    }

    .blob-two {
      right: -9%;
      bottom: -18%;
      background: linear-gradient(145deg, var(--cyan), #7c79ff);
      animation-delay: -5s;
      animation-duration: 15s;
    }

    .blob-three {
      top: 22%;
      right: 17%;
      width: clamp(8rem, 15vw, 17rem);
      background: linear-gradient(145deg, var(--pink), #ffb570);
      opacity: 0.26;
      animation-delay: -8s;
      animation-duration: 10s;
    }

    .ambient-star {
      position: absolute;
      color: rgba(255, 255, 255, 0.9);
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.4vw, 2rem);
      text-shadow: 0 2px 12px rgba(91, 43, 215, 0.25);
      animation: star-twinkle 3.2s ease-in-out infinite;
    }

    .ambient-star:nth-of-type(4) { left: 7%; top: 62%; }
    .ambient-star:nth-of-type(5) { right: 9%; top: 14%; animation-delay: -1.1s; }
    .ambient-star:nth-of-type(6) { left: 34%; top: 9%; animation-delay: -2.2s; }
    .ambient-star:nth-of-type(7) { right: 31%; bottom: 8%; animation-delay: -0.6s; }

    .topbar {
      position: relative;
      z-index: 20;
      min-height: var(--topbar-height);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 0.8rem;
      padding: 0.55rem clamp(0.65rem, 2vw, 1.4rem);
      border-bottom: 2px solid rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.74);
      box-shadow: 0 5px 22px rgba(76, 42, 127, 0.12);
      backdrop-filter: blur(14px) saturate(1.25);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: clamp(0.5rem, 1.5vw, 1rem);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 2.35rem;
      padding: 0.45rem 0.75rem;
      color: var(--purple-deep);
      border: 2px solid rgba(124, 77, 255, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 7px 16px rgba(91, 43, 215, 0.15);
    }

    .game-title {
      min-width: 0;
      margin: 0;
      color: var(--purple-deep);
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 2.3vw, 1.65rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-star {
      color: var(--pink);
      text-shadow: 0 2px 0 #fff;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.3rem, 1vw, 0.6rem);
      white-space: nowrap;
    }

    .hud-chip {
      display: grid;
      grid-template-columns: auto auto;
      align-items: baseline;
      gap: 0.28rem;
      min-height: 2.55rem;
      padding: 0.38rem 0.72rem;
      border: 2px solid rgba(124, 77, 255, 0.12);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 4px 0 rgba(91, 43, 215, 0.08);
      color: var(--ink-soft);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .hud-value {
      color: var(--purple-deep);
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hud-value.rank-C { color: #4a4a56; }
    .hud-value.rank-B { color: #0f7a48; }
    .hud-value.rank-A { color: #2a4fd4; }
    .hud-value.rank-S { color: #b45309; }

    .hud-chip.score-bump {
      animation: score-bump 420ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    .family-chip {
      border-color: rgba(255, 94, 168, 0.18);
    }

    .family-chip .hud-value {
      color: #d83283;
      font-family: var(--font-body);
      font-size: 0.88rem;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
    }

    .sound-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-width: 2.75rem;
      min-height: 2.65rem;
      padding: 0.45rem 0.78rem;
      color: var(--purple-deep);
      border: 2px solid rgba(124, 77, 255, 0.15);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 4px 0 rgba(91, 43, 215, 0.1);
      cursor: pointer;
      font-weight: 900;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
    }

    .sound-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 12px rgba(91, 43, 215, 0.16);
    }

    .sound-toggle[aria-pressed="false"] {
      color: var(--ink-soft);
      opacity: 0.75;
    }

    .sound-icon {
      width: 1.2rem;
      color: var(--pink);
      font-size: 1.05rem;
      line-height: 1;
    }

    .game-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .game-stage::before {
      content: "";
      position: absolute;
      inset: clamp(0.4rem, 1.4vw, 1rem);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: clamp(1.3rem, 3vw, 2.4rem);
      background: rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.18);
      pointer-events: none;
    }

    .game-stage.match-flash::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(circle at var(--flash-x, 50%) var(--flash-y, 50%), rgba(255, 255, 255, 0.86), rgba(255, 216, 77, 0.26) 16%, transparent 45%);
      animation: match-flash 520ms ease-out both;
    }

    .board-wrap {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: clamp(0.7rem, 2vw, 1.5rem);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), var(--card-size));
      grid-template-rows: repeat(var(--rows, 2), var(--card-size));
      gap: var(--grid-gap);
      align-content: center;
      justify-content: center;
      perspective: 1100px;
      transition: filter 220ms ease, transform 220ms ease;
    }

    .board.celebrating {
      animation: board-celebrate 620ms cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    .card {
      position: relative;
      width: var(--card-size);
      height: var(--card-size);
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: clamp(11px, calc(var(--card-size) * 0.14), 24px);
      background: transparent;
      cursor: pointer;
      overflow: visible;
      transform: translateY(0) scale(1) rotate(0);
      opacity: 1;
      animation: deal-card 520ms var(--deal-delay, 0ms) cubic-bezier(0.16, 1.35, 0.42, 1) backwards;
      -webkit-tap-highlight-color: transparent;
    }

    .card:not(.flipped):not(.matched):hover {
      z-index: 2;
      transform: translateY(-4px) rotate(var(--hover-tilt, -1deg)) scale(1.035);
    }

    .card:not(.flipped):not(.matched):active {
      transform: translateY(1px) scale(0.98);
    }

    .card-inner {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 460ms cubic-bezier(0.2, 0.78, 0.25, 1.18);
      /* Do not use filter here — it breaks preserve-3d and hides both faces when flipped. */
      box-shadow: 0 8px 5px rgba(73, 38, 119, 0.19);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(0.3rem, calc(var(--card-size) * 0.075), 0.8rem);
      border: clamp(2px, calc(var(--card-size) * 0.035), 5px) solid rgba(255, 255, 255, 0.88);
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 2px rgba(91, 43, 215, 0.08),
        inset 0 -8px 0 rgba(91, 43, 215, 0.08);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }

    .card-back {
      color: #fff;
      transform: rotateY(0deg) translateZ(1px);
      background:
        radial-gradient(circle at 25% 22%, rgba(255, 255, 255, 0.45) 0 4%, transparent 5%),
        radial-gradient(circle at 76% 72%, rgba(255, 216, 77, 0.7) 0 6%, transparent 7%),
        linear-gradient(145deg, #ff6eac 0%, #9a5cff 48%, #4b8eff 100%);
    }

    .card-back::before,
    .card-back::after {
      content: "";
      position: absolute;
      width: 68%;
      height: 25%;
      border: 2px solid rgba(255, 255, 255, 0.26);
      border-radius: 999px;
      transform: rotate(34deg);
    }

    .card-back::after {
      transform: rotate(-34deg);
    }

    .card-mark {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 48%;
      aspect-ratio: 1;
      border: 3px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 6px 0 rgba(60, 28, 137, 0.18);
      font-family: var(--font-display);
      font-size: clamp(1.3rem, calc(var(--card-size) * 0.34), 4rem);
      font-weight: 700;
      text-shadow: 0 4px 0 rgba(91, 43, 215, 0.2);
    }

    .card-spark {
      position: absolute;
      top: 10%;
      right: 12%;
      color: var(--yellow);
      font-size: clamp(0.65rem, calc(var(--card-size) * 0.15), 1.5rem);
      animation: star-twinkle 2s ease-in-out infinite;
    }

    .card-front {
      grid-template-rows: auto 1fr;
      color: var(--ink);
      background-color: #fff7fb;
      background-image:
        radial-gradient(circle at 78% 18%, hsla(var(--pair-hue, 290), 95%, 70%, 0.32), transparent 34%),
        linear-gradient(145deg, #fff 0%, hsl(var(--pair-hue, 290), 100%, 96%) 100%);
      border-color: hsl(var(--pair-hue, 290), 88%, 68%);
      transform: rotateY(180deg) translateZ(1px);
    }

    .card-front::after {
      content: "";
      position: absolute;
      top: -80%;
      left: -45%;
      width: 35%;
      height: 250%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
      transform: rotate(24deg);
      transition: left 540ms ease;
    }

    .card.flipped .card-front::after,
    .card.matched .card-front::after {
      left: 125%;
    }

    .card-kind {
      align-self: start;
      padding: 0.15em 0.55em;
      border-radius: 999px;
      color: hsl(var(--pair-hue, 290), 62%, 35%);
      background: hsla(var(--pair-hue, 290), 90%, 68%, 0.2);
      font-size: clamp(0.48rem, calc(var(--card-size) * 0.085), 0.8rem);
      font-weight: 900;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.075em;
    }

    .card-value {
      position: relative;
      z-index: 1;
      align-self: center;
      font-family: var(--font-display);
      font-size: clamp(0.88rem, calc(var(--card-size) * 0.2), 2.65rem);
      font-weight: 700;
      line-height: 1.05;
      text-align: center;
      text-wrap: balance;
    }

    .card.matched {
      cursor: default;
      animation: matched-card 650ms cubic-bezier(0.16, 1.5, 0.42, 1) both;
    }

    .card.matched .card-front {
      border-color: var(--green);
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.9), transparent 42%),
        linear-gradient(145deg, #edfff5, #b8f2d1);
      box-shadow:
        inset 0 0 0 2px rgba(32, 139, 82, 0.1),
        inset 0 -8px 0 rgba(32, 139, 82, 0.09),
        0 0 0 4px rgba(255, 255, 255, 0.52);
    }

    .card.matched .card-front::before {
      content: "✓";
      position: absolute;
      right: 7%;
      bottom: 5%;
      display: grid;
      place-items: center;
      width: 24%;
      aspect-ratio: 1;
      color: #fff;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 3px 0 #24995a;
      font-size: clamp(0.58rem, calc(var(--card-size) * 0.13), 1.25rem);
      font-weight: 900;
    }

    .card:focus-visible,
    .back-link:focus-visible,
    .sound-toggle:focus-visible,
    .primary-btn:focus-visible {
      outline: 4px solid #3f1a9f;
      outline-offset: 3px;
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: clamp(0.7rem, 2vw, 1.2rem);
      z-index: 8;
      max-width: min(90vw, 38rem);
      margin: 0;
      padding: 0.55rem 1rem;
      color: var(--ink);
      border: 2px solid rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 24px rgba(82, 39, 137, 0.16);
      font-weight: 900;
      text-align: center;
      transform: translate(-50%, 150%);
      opacity: 0;
      pointer-events: none;
      transition: transform 260ms cubic-bezier(0.2, 1.35, 0.4, 1), opacity 180ms ease;
    }

    .message.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .message.celebrate {
      color: #922258;
      background: linear-gradient(90deg, #fff, #fff1f8);
    }

    .effects {
      position: absolute;
      inset: 0;
      z-index: 7;
      overflow: hidden;
      pointer-events: none;
    }

    .fx-particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size, 10px);
      aspect-ratio: 1;
      border-radius: var(--radius, 50%);
      background: var(--color, var(--yellow));
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
      transform: translate(-50%, -50%) scale(0);
      animation: particle-burst var(--duration, 720ms) var(--delay, 0ms) cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
    }

    .score-pop {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 2;
      color: #fff;
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4vw, 2.35rem);
      font-weight: 700;
      text-shadow:
        0 3px 0 var(--purple-deep),
        0 0 12px var(--pink),
        0 0 26px rgba(255, 94, 168, 0.75);
      transform: translate(-50%, -20%) scale(0.5);
      animation: score-float 900ms cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
    }

    .confetti {
      position: absolute;
      top: -8%;
      left: var(--left);
      width: var(--width, 9px);
      height: var(--height, 17px);
      border-radius: 3px;
      background: var(--color);
      opacity: 0;
      transform: rotate(var(--start-rotation));
      animation: confetti-fall var(--fall-time) var(--delay) cubic-bezier(0.16, 0.72, 0.44, 1) forwards;
    }

    .round-ribbon {
      position: absolute;
      left: 50%;
      top: 46%;
      z-index: 9;
      padding: 0.55rem 1.35rem;
      color: #fff;
      border: 3px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 10px 28px rgba(91, 43, 215, 0.35);
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 4vw, 2rem);
      font-weight: 700;
      white-space: nowrap;
      transform: translate(-50%, -50%) scale(0);
      animation: ribbon-pop 1050ms cubic-bezier(0.18, 1.45, 0.4, 1) forwards;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.64), transparent 45%),
        rgba(109, 70, 188, 0.22);
      backdrop-filter: blur(8px) saturate(1.15);
      opacity: 1;
      visibility: visible;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay-card {
      position: relative;
      width: min(92vw, 34rem);
      padding: clamp(1.25rem, 4vw, 2.3rem);
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.84);
      border-radius: clamp(1.6rem, 4vw, 2.5rem);
      background:
        radial-gradient(circle at 88% 12%, rgba(255, 216, 77, 0.45), transparent 24%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(255, 244, 251, 0.96));
      box-shadow:
        0 18px 0 rgba(91, 43, 215, 0.1),
        0 28px 60px rgba(73, 31, 126, 0.28);
      text-align: center;
      animation: overlay-arrive 520ms cubic-bezier(0.16, 1.35, 0.42, 1) both;
    }

    .overlay-card::before,
    .overlay-card::after {
      content: "✦";
      position: absolute;
      color: var(--yellow);
      font-size: clamp(2rem, 7vw, 4rem);
      opacity: 0.72;
      transform: rotate(-14deg);
    }

    .overlay-card::before { left: -0.25rem; top: -0.55rem; }
    .overlay-card::after { right: -0.2rem; bottom: -0.8rem; color: var(--cyan); }

    .overlay-kicker {
      display: inline-block;
      margin-bottom: 0.55rem;
      padding: 0.3rem 0.78rem;
      color: #b6286f;
      border-radius: 999px;
      background: #ffe3f1;
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .overlay h2 {
      margin: 0;
      color: var(--purple-deep);
      font-family: var(--font-display);
      font-size: clamp(2.15rem, 8vw, 4rem);
      font-weight: 700;
      line-height: 0.96;
      text-wrap: balance;
    }

    .overlay-copy {
      max-width: 34ch;
      margin: 0.85rem auto 1.2rem;
      color: var(--ink-soft);
      font-size: clamp(0.95rem, 2.5vw, 1.12rem);
      font-weight: 800;
      line-height: 1.45;
      text-wrap: balance;
    }

    #overlay-extra {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0 auto 1rem;
      text-align: center;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      padding: 0.12rem 0.45rem;
      border-radius: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      border: 1px solid transparent;
    }

    .rank-C {
      background: rgba(92, 92, 104, 0.12);
      color: #4a4a56;
      border-color: rgba(74, 74, 86, 0.35);
    }
    .rank-B {
      background: rgba(18, 148, 86, 0.14);
      color: #0f7a48;
      border-color: rgba(15, 122, 72, 0.4);
    }
    .rank-A {
      background: rgba(59, 95, 217, 0.14);
      color: #2a4fd4;
      border-color: rgba(42, 79, 212, 0.4);
    }
    .rank-S {
      background: linear-gradient(135deg, rgba(255, 196, 56, 0.45), rgba(255, 122, 64, 0.32));
      color: #b45309;
      border-color: rgba(180, 83, 9, 0.45);
      box-shadow: 0 0 10px rgba(255, 176, 40, 0.28);
      animation: sGlow 1.8s ease-in-out infinite;
    }

    @keyframes sGlow {
      50% { box-shadow: 0 0 20px rgba(255, 176, 40, 0.5); }
    }

    .rank-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 0.75rem;
      margin: 0.35rem auto;
      font-size: 0.78rem;
      color: #5b3d7a;
      max-width: 42ch;
    }

    .rank-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }

    .rank-up-banner {
      margin: 0.35rem auto;
      padding: 0.55rem 0.95rem;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(255, 216, 77, 0.45), rgba(255, 94, 168, 0.22));
      border: 1px solid rgba(124, 77, 255, 0.35);
      font-family: var(--font-display);
      font-weight: 700;
      color: #5b2bd7;
      animation: rankPop 0.6s ease;
    }

    @keyframes rankPop {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    .end-stats {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 0.5rem auto;
    }

    .end-stat {
      background: rgba(124, 77, 255, 0.08);
      border: 1px solid rgba(124, 77, 255, 0.2);
      border-radius: 12px;
      padding: 0.55rem 0.9rem;
      min-width: 90px;
      text-align: center;
    }

    .end-stat .lbl {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #674f86;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .end-stat .num {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: #5b2bd7;
    }

    .end-stat .num.rank-C { color: #4a4a56; }
    .end-stat .num.rank-B { color: #0f7a48; }
    .end-stat .num.rank-A { color: #2a4fd4; }
    .end-stat .num.rank-S { color: #b45309; }

    .overlay-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
      margin: 0 auto 1.15rem;
    }

    .overlay-stats[hidden] {
      display: none;
    }

    .overlay-stat {
      padding: 0.65rem;
      border: 2px solid rgba(124, 77, 255, 0.11);
      border-radius: 16px;
      background: rgba(244, 239, 255, 0.72);
    }

    .overlay-stat strong {
      display: block;
      color: var(--purple-deep);
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4vw, 1.8rem);
    }

    .overlay-stat span {
      display: block;
      color: var(--ink-soft);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .primary-btn {
      position: relative;
      min-width: 12rem;
      min-height: 3.25rem;
      padding: 0.75rem 1.65rem;
      overflow: hidden;
      color: #fff;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow:
        0 7px 0 #5127bb,
        0 14px 22px rgba(91, 43, 215, 0.28);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .primary-btn::after {
      content: "";
      position: absolute;
      top: -80%;
      left: -35%;
      width: 22%;
      height: 260%;
      background: rgba(255, 255, 255, 0.5);
      transform: rotate(24deg);
      animation: button-shine 2.7s ease-in-out infinite;
    }

    .primary-btn:hover {
      transform: translateY(-2px) scale(1.025);
      box-shadow:
        0 9px 0 #5127bb,
        0 18px 26px rgba(91, 43, 215, 0.32);
    }

    .primary-btn:active {
      transform: translateY(5px);
      box-shadow:
        0 2px 0 #5127bb,
        0 8px 14px rgba(91, 43, 215, 0.24);
    }

    .primary-btn:disabled {
      cursor: wait;
      filter: grayscale(0.25);
      opacity: 0.72;
    }

    @keyframes drift-pattern {
      to { background-position: 48px 48px, 70px 72px; }
    }

    @keyframes blob-float {
      0% { transform: translate3d(-2%, -2%, 0) rotate(-5deg) scale(0.96); }
      100% { transform: translate3d(7%, 6%, 0) rotate(8deg) scale(1.08); }
    }

    @keyframes star-twinkle {
      0%, 100% { transform: scale(0.82) rotate(-8deg); opacity: 0.5; }
      50% { transform: scale(1.18) rotate(10deg); opacity: 1; }
    }

    @keyframes deal-card {
      0% { opacity: 0; transform: translateY(32px) scale(0.72) rotate(var(--deal-tilt, 0deg)); }
      70% { opacity: 1; transform: translateY(-4px) scale(1.035) rotate(0); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes matched-card {
      0%, 100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
      40% { opacity: 1; transform: translateY(-8px) rotate(-2deg) scale(1.1); }
      65% { opacity: 1; transform: translateY(-2px) rotate(2deg) scale(1.04); }
    }

    @keyframes board-celebrate {
      0%, 100% { transform: scale(1); filter: saturate(1); }
      45% { transform: scale(1.018); filter: saturate(1.3) brightness(1.08); }
    }

    @keyframes match-flash {
      0% { opacity: 0; }
      28% { opacity: 0.88; }
      100% { opacity: 0; }
    }

    @keyframes score-bump {
      0%, 100% { transform: scale(1); }
      45% { transform: translateY(-3px) scale(1.12) rotate(-1deg); box-shadow: 0 8px 18px rgba(255, 94, 168, 0.25); }
    }

    @keyframes particle-burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
      }
      18% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rotation)) scale(1);
      }
    }

    @keyframes score-float {
      0% { opacity: 0; transform: translate(-50%, -10%) scale(0.45) rotate(-5deg); }
      22% { opacity: 1; transform: translate(-50%, -35%) scale(1.2) rotate(2deg); }
      100% { opacity: 0; transform: translate(-50%, -180%) scale(0.92) rotate(0); }
    }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(var(--start-rotation)); }
      10% { opacity: 1; }
      100% { opacity: 0.95; transform: translate3d(var(--drift), 115vh, 0) rotate(var(--end-rotation)); }
    }

    @keyframes ribbon-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-6deg); }
      22% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(2deg); }
      70% { opacity: 1; transform: translate(-50%, -78%) scale(1) rotate(0); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(0.96); }
    }

    @keyframes overlay-arrive {
      from { opacity: 0; transform: translateY(24px) scale(0.9) rotate(-1deg); }
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes button-shine {
      0%, 50% { left: -35%; }
      78%, 100% { left: 125%; }
    }

    @media (max-width: 780px) {
      :root { --topbar-height: 5.9rem; }

      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "brand controls"
          "hud hud";
        gap: 0.35rem 0.55rem;
        padding: 0.4rem 0.55rem;
      }

      .brand { grid-area: brand; }
      .hud { grid-area: hud; }
      .controls { grid-area: controls; }
      .hud-chip { min-height: 2rem; padding: 0.25rem 0.55rem; border-radius: 12px; }
      .hud-value { font-size: 1rem; }
      .family-chip { display: none; }
      .message { bottom: 0.45rem; font-size: 0.82rem; }
    }

    @media (max-width: 470px) {
      .back-link { min-height: 2.1rem; padding: 0.32rem 0.56rem; font-size: 0.78rem; }
      .game-title { font-size: 1.03rem; }
      .control-label { display: none; }
      .sound-toggle { min-width: 2.4rem; min-height: 2.3rem; padding: 0.35rem; }
      .hud-chip { font-size: 0.62rem; }
      .hud-value { font-size: 0.9rem; }
      .overlay-card { padding: 1.2rem 1rem 1.4rem; }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      :root { --topbar-height: 3.25rem; }

      .topbar {
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        grid-template-areas: "brand hud controls";
        min-height: var(--topbar-height);
        padding: 0.28rem 0.55rem;
      }

      .brand { grid-area: brand; }
      .hud { grid-area: hud; }
      .controls { grid-area: controls; }
      .back-link { min-height: 2rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; }
      .title-star { display: none; }
      .game-title { font-size: 1rem; }
      .hud-chip { min-height: 2rem; padding: 0.2rem 0.45rem; }
      .family-chip { display: none; }
      .sound-toggle { min-height: 2.1rem; padding-block: 0.2rem; }
      .message { bottom: 0.3rem; padding: 0.35rem 0.7rem; font-size: 0.75rem; }
      .overlay-card { max-height: 90%; padding: 0.85rem 1.3rem 1rem; }
      .overlay h2 { font-size: clamp(1.7rem, 7vh, 2.5rem); }
      .overlay-copy { margin: 0.45rem auto 0.65rem; font-size: 0.84rem; }
      .overlay-stats { margin-bottom: 0.6rem; }
      .primary-btn { min-height: 2.65rem; padding-block: 0.55rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }

      .ambient::before,
      .fx-particle,
      .confetti,
      .round-ribbon {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="game-app">
    <div class="ambient" aria-hidden="true">
      <span class="blob blob-one"></span>
      <span class="blob blob-two"></span>
      <span class="blob blob-three"></span>
      <span class="ambient-star">✦</span>
      <span class="ambient-star">✧</span>
      <span class="ambient-star">✦</span>
      <span class="ambient-star">✧</span>
    </div>

    <header class="topbar">
      <div class="brand">
        <a class="back-link" href="/" aria-label="Back to the MathArcade">← Arcade</a>
        <h1 class="game-title"><span class="title-star">✦</span> Memory Match</h1>
      </div>

      <div class="hud" aria-label="Game progress">
        <div class="hud-chip">
          <span>Rank</span>
          <strong class="hud-value rank-C" id="rank-value">C</strong>
        </div>
        <div class="hud-chip">
          <span>Round</span>
          <strong class="hud-value" id="round-value">1</strong>
        </div>
        <div class="hud-chip">
          <span>Pairs</span>
          <strong class="hud-value" id="pairs-value">0 / 4</strong>
        </div>
        <div class="hud-chip" id="score-chip">
          <span>Score</span>
          <strong class="hud-value" id="score-value">0</strong>
        </div>
        <div class="hud-chip family-chip">
          <span>Facts</span>
          <strong class="hud-value" id="family-value">Addition</strong>
        </div>
      </div>

      <div class="controls">
        <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true" aria-label="Turn sound off">
          <span class="sound-icon" id="sound-icon" aria-hidden="true">♪</span>
          <span class="control-label" id="sound-label">Sound on</span>
        </button>
      </div>
    </header>

    <main class="game-stage" id="stage">
      <div class="board-wrap" id="board-wrap">
        <div class="board" id="board" aria-label="Memory cards"></div>
      </div>

      <div class="effects" id="effects" aria-hidden="true"></div>
      <p class="message" id="message" role="status" aria-live="polite" aria-atomic="true"></p>

      <section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <div class="overlay-card">
          <span class="overlay-kicker" id="overlay-kicker">Math memory party</span>
          <h2 id="overlay-title">Find the pairs!</h2>
          <p class="overlay-copy" id="overlay-copy">
            Flip a math problem and find its answer. Every match earns a celebration, and each round grows with you. Clear a 24-card board to rank up.
          </p>
          <div id="overlay-extra"></div>
          <div class="overlay-stats" id="overlay-stats" hidden>
            <div class="overlay-stat">
              <strong id="round-points">0</strong>
              <span>Round points</span>
            </div>
            <div class="overlay-stat">
              <strong id="session-points">0</strong>
              <span>Session total</span>
            </div>
          </div>
          <button class="primary-btn" id="overlay-action" type="button">Deal 8 cards</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/memorymatch.js"></script>
</body>
</html>
